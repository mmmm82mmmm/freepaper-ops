<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプリが移動しました</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans JP',sans-serif; background:#f4f0e8; color:#1a1a1a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:#fff; border-radius:16px; padding:32px 24px; max-width:420px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,.1); text-align:center; }
.icon { font-size:52px; margin-bottom:16px; }
h1 { font-size:20px; font-weight:900; margin-bottom:12px; color:#d42020; }
p { font-size:14px; line-height:1.8; margin-bottom:20px; color:#333; }
.steps { text-align:left; background:#fff8e8; border:1px solid #f0d090; border-radius:10px; padding:16px; margin-bottom:20px; font-size:13px; line-height:1.9; }
.steps b { color:#c47a0a; }
.btn { display:block; width:100%; padding:16px; background:#c47a0a; color:#fff; text-decoration:none; border-radius:10px; font-size:16px; font-weight:900; margin-bottom:10px; }
.note { font-size:11px; color:#888; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔄</div>
  <h1>アプリが新しくなりました</h1>
  <p>このアイコンは使えません。<br>お手数ですが、新しいアプリに切り替えてください。</p>

  <div class="steps">
    <b>【切り替え手順】</b><br>
    ① このホーム画面アイコンを<b>削除</b><br>
    ② 下のボタンから新アプリを開く<br>
    ③ 新アプリを<b>ホーム画面に追加</b>し直す
  </div>

  <a class="btn" href="./driver.html">▶ 新しい運転手画面を開く</a>

  <p class="note">
    ※古いアイコンは必ず削除してください。<br>
    分からない場合はリーダーに確認してください。
  </p>
</div>
</body>
</html>
