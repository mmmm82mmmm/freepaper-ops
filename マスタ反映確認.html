<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マスタ反映の確認 - 納本システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--card:#fff;--ink:#1a1a1a;--muted:#888;--border:#e0dbd0;
  --green:#1a8a4a;--amber:#c47a0a;--blue:#1a5cd4;--red:#d42020;--purple:#7a3dc4;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px;}

.app-header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:50;flex-wrap:wrap;}
.app-header a{color:#fff;text-decoration:none;font-size:18px;}
.app-title{font-size:15px;font-weight:900;flex:1;}
.month-sel{font-size:12px;background:#333;color:#fff;border:none;padding:5px 10px;border-radius:6px;
  font-family:inherit;font-weight:700;}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 10px;border-radius:6px;
  font-size:13px;cursor:pointer;font-family:inherit;}

.container{max-width:1000px;margin:0 auto;padding:16px;}
.lead{background:#fff8e8;border:1px solid #f0d090;border-radius:10px;padding:12px 14px;
  font-size:12px;color:#7a5a00;line-height:1.9;margin-bottom:16px;}

.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.sm{flex:1 1 150px;background:var(--card);border-radius:10px;padding:12px 14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:5px solid var(--border);}
.sm.hot{border-left-color:var(--red);background:#fff4f4;}
.sm .n{font-size:26px;font-weight:900;font-family:'DM Mono',monospace;line-height:1.2;}
.sm .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;}

.sec{background:var(--card);border-radius:12px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);
  overflow:hidden;}
.sec-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;}
.sec-title{font-size:14px;font-weight:900;flex:1;}
.cnt{font-size:11px;font-weight:900;background:var(--ink);color:#fff;padding:2px 8px;border-radius:10px;}
.cnt.zero{background:#cfc9bd;}
.sec-note{font-size:11px;color:var(--muted);line-height:1.8;padding:0 16px 10px;}
.sec-body{padding:0 16px 14px;}

.row{border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:9px;background:#fdfcfa;}
.row .nm{font-size:13px;font-weight:900;}
.row .meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.7;}
.vals{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px;}
.v{padding:3px 9px;border-radius:6px;font-weight:900;font-family:'DM Mono',monospace;}
.v.month{background:#e8f0ff;color:var(--blue);}
.v.master{background:#f0ede8;color:#555;}
.arrow{color:var(--muted);font-size:13px;}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.b{border:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:900;cursor:pointer;
  font-family:inherit;}
.b.apply{background:var(--green);color:#fff;}
.b.revert{background:#fff;color:#555;border:1px solid var(--border);}
.b.back{background:var(--blue);color:#fff;}
.b:disabled{opacity:.5;cursor:default;}
.b.bulk{background:var(--ink);color:#fff;padding:8px 14px;}

.stores{font-size:11px;color:#555;line-height:1.8;margin-top:6px;
  background:#fff;border:1px dashed var(--border);border-radius:6px;padding:7px 9px;}
.memo{font-size:12px;color:#b01818;background:#fdecec;border-radius:6px;padding:7px 10px;
  margin-top:7px;white-space:pre-wrap;line-height:1.7;font-weight:700;}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:22px;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--ink);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fde8e8;border:1px solid #f5bcbc;border-radius:9px;padding:12px 14px;
  font-size:12px;color:#b01818;line-height:1.8;}
.msg{font-size:12px;font-weight:700;margin-left:auto;}

/* ===== マスタ修正のモーダル ===== */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  align-items:center;justify-content:center;padding:14px;}
.modal.open{display:flex;}
.mbox{background:var(--card);border-radius:14px;width:100%;max-width:620px;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;}
.mhead{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.mhead .t{font-size:15px;font-weight:900;flex:1;}
.mhead .x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.mbody{flex:1;overflow:auto;padding:14px 16px;}
.mfoot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:9px;
  align-items:center;flex-wrap:wrap;}
.mfoot label{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;}
.fsec{font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.fsec:first-child{margin-top:0;}
.fsec.warn{color:var(--red);border-bottom-color:#f5bcbc;}
.f{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
.f > label{font-size:12px;font-weight:700;width:110px;flex:0 0 auto;color:#444;}
.f input[type=text],.f input[type=number],.f select,.f textarea{
  flex:1 1 180px;padding:7px 9px;font-size:13px;font-family:inherit;
  border:1px solid var(--border);border-radius:7px;background:#fff;}
.f textarea{min-height:60px;resize:vertical;}
.f .chks{flex:1 1 180px;display:flex;gap:10px;flex-wrap:wrap;}
.f .chks label{font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;}
.f .hint{font-size:10px;color:var(--muted);flex:1 1 100%;padding-left:120px;line-height:1.6;}
.changed{background:#fffbe6 !important;border-color:var(--amber) !important;}
.warnbox{background:#fde8e8;border:1px solid #f5bcbc;border-radius:8px;padding:9px 11px;
  font-size:11px;color:#b01818;line-height:1.8;margin-bottom:10px;}
</style>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body>

<div class="app-header">
  <a href="index.html">←</a>
  <div class="app-title">🔁 マスタ反映の確認</div>
  <select class="month-sel" id="month-sel" onchange="load()"></select>
  <button class="hbtn" onclick="load()">🔄</button>
</div>

<div class="container">
  <div class="lead">
    納本作業の最中に直した内容と、<strong>設置店マスタ</strong>の食い違いを一覧にします。<br>
    作業中は今月分だけを直し、ここで管理者が<strong>マスタに反映するかどうか</strong>を判断してください。<br>
    反映するか、今月分を元に戻すか、<strong>どちらかを押せば一覧から消えます</strong>。
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
</div>

<div class="modal" id="edit-modal">
  <div class="mbox">
    <div class="mhead">
      <div class="t" id="edit-title">設置店マスタを修正</div>
      <button class="x" onclick="closeMasterEdit()">✕</button>
    </div>
    <div class="mbody" id="edit-body"></div>
    <div class="mfoot">
      <label><input type="checkbox" id="edit-sync" checked> 今月分にも反映する</label>
      <button class="b revert" style="margin-left:auto" onclick="closeMasterEdit()">やめる</button>
      <button class="b apply" id="edit-save" onclick="saveMasterEdit()">保存する</button>
    </div>
  </div>
</div>

<script>
const PROXY  = KINTONE_CONFIG.PROXY;
const DOMAIN = KINTONE_CONFIG.DOMAIN;
const APP_MASTER = 268;
const APP_NOHON  = 269;

/* マスタ(268) と 月号(269) で同じ意味でもフィールドコードが違う */
const M = { id:'文字列__1行__0', name:'文字列__1行__2', nabon:'数値_4',
            osoi:'チェックボックス', status:'ドロップダウン',
            genre:'文字列__1行__1', bldg:'文字列__1行__3', floor:'文字列__1行__4',
            time:'文字列__1行__5', jo:'文字列__1行__7', chome:'文字列__1行__8',
            place:'文字列__1行__9', group:'文字列__1行__11', comment:'文字列__複数行__0',
            order:'数値_2', map:'数値_3',
            rack:'チェックボックス_0', teikyu:'チェックボックス_1',
            refill:'チェックボックス_2', pop:'チェックボックス_3', bundle:'チェックボックス_4',
            route:'ドロップダウン_0', freq:'ドロップダウン_1' };

/* 設置店マスタ → 今月分 の対応。マスタを直した時に今月分へも書き写すために使う */
const MAP_TO_MONTH = [
  { m:'name',  n:'文字列__1行__1', label:'店名' },
  { m:'bldg',  n:'文字列__1行__2', label:'ビル名' },
  { m:'floor', n:'文字列__1行__3', label:'階数' },
  { m:'route', n:'文字列__1行__4', label:'ルート' },
  { m:'genre', n:'文字列__1行__6', label:'ジャンル' },
  { m:'place', n:'文字列__1行__7', label:'設置場所説明' },
  { m:'comment', n:'文字列__1行__9', label:'コメント' },
  { m:'group', n:'文字列__1行__0', label:'グループ' },
  { m:'time',  n:'文字列__1行__17', label:'時間指定' },
  { m:'order', n:'数値_1', label:'ルート順', num:true },
  { m:'nabon', n:'数値_2', label:'通常納本数', num:true },
  { m:'osoi',  n:'チェックボックス_0', label:'遅', chk:true },
  { m:'rack',  n:'チェックボックス_1', label:'ラック交換', chk:true },
  { m:'teikyu',n:'チェックボックス_2', label:'定休日', chk:true },
  { m:'pop',   n:'チェックボックス_3', label:'POP交換', chk:true },
  { m:'bundle',n:'チェックボックス_4', label:'束渡し', chk:true },
];
const FREQ_MAP_ISSUE_ONLY = '毎月（MAPは発行月のみ）';
const N = { month:'文字列__1行_', sid:'文字列__1行__5', name:'文字列__1行__1',
            bldg:'文字列__1行__2', floor:'文字列__1行__3', route:'文字列__1行__4',
            group:'文字列__1行__0', nabon:'数値_2', osoi:'チェックボックス_0',
            memo:'文字列__複数行_', status:'ドロップダウン' };

const OSOI = '遅';
const STATUS_CHECK = '要確認';
const STATUS_ACTIVE = '稼働中';
const INVALID = new Set(['', 'なし', 'ナシ', '無し', '-', '―', '－']);

/* 「このまま要確認にしておく」と判断した店を覚えておく場所。
   納本データ管理に専用のレコードを1つ持つ（この画面だけが読み書きする）。
   月号ごとに分けてあるので、翌月になれば自動的に判断し直しになる。 */
const CHECKED_KEY = '__mastercheck__';
let checkedMap = {};     // { '2026年11月号': { '設置場所ID': '確認した日時' } }
let checkedRecId = null; // 保存先レコードの$id（無ければ作る）
let showChecked = false; // 確認済みも表示するか

let data = null;         // { nabon:[], osoi:[], check:[], memo:[] }
let choices = {};        // ドロップダウンの選択肢（実データから集める）
let masterBySid = new Map();   // 設置場所ID → マスタレコード（一覧取得ぶん・列は一部）
let editing = null;      // 編集中の { sid, mrec, nrec }

function uniq(arr) {
  return [...new Set(arr.map(v => String(v ?? '').trim()).filter(Boolean))].sort();
}

function esc(x){ return String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sidOf(r, f){ return String(r[f]?.value || '').trim(); }
function validSid(v){ return !INVALID.has(String(v ?? '').trim()); }
function isOsoi(r, f){ return (r[f]?.value || []).includes(OSOI); }
function numOf(r, f){ return parseFloat(r[f]?.value) || 0; }

/* ===== 月号の選択肢。管理者が作業号を固定していればそれを既定にする ===== */
async function initMonth() {
  const sel = document.getElementById('month-sel');
  const now = new Date();
  const opts = [];
  for (let d = -2; d <= 2; d++) {
    const t = new Date(now.getFullYear(), now.getMonth() + 1 + d, 1);
    opts.push(`${t.getFullYear()}年${t.getMonth() + 1}月号`);
  }
  let forced = null;
  try {
    const q = encodeURIComponent('文字列__1行_ = "__settings__" limit 1');
    const res = await fetch(`${PROXY}/k/v1/records.json?app=${APP_NOHON}&query=${q}&subdomain=${DOMAIN}`, {
      headers: { 'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON }
    });
    const d = await res.json();
    if (res.ok && d.records?.length) {
      const o = JSON.parse(d.records[0]['文字列__複数行__0']?.value || '{}');
      forced = o.forceWorkMonth || null;
    }
  } catch (e) { console.warn('作業号の設定を読めませんでした:', e); }
  if (forced && !opts.includes(forced)) opts.push(forced);
  const pick = forced || opts[2];
  sel.innerHTML = opts.map(m => `<option${m === pick ? ' selected' : ''}>${esc(m)}</option>`).join('');
}

/* 要確認の店を「まだ見ていない分」と「このままにすると決めた分」に分ける */
function splitChecked(diffs, month) {
  const done = checkedMap[month] || {};
  diffs.checkDone = diffs.check.filter(x => done[sidOf(x.r, N.sid)]);
  diffs.check     = diffs.check.filter(x => !done[sidOf(x.r, N.sid)]);
  return diffs;
}

async function loadChecked() {
  const q = encodeURIComponent(`文字列__1行_ = "${CHECKED_KEY}" limit 1`);
  const res = await fetch(`${PROXY}/k/v1/records.json?app=${APP_NOHON}&query=${q}&subdomain=${DOMAIN}`, {
    headers: { 'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON }
  });
  if (!res.ok) throw new Error('確認済みの記録を読めませんでした');
  const d = await res.json();
  if (!d.records?.length) { checkedRecId = null; checkedMap = {}; return; }
  checkedRecId = d.records[0].$id.value;
  const raw = d.records[0]['文字列__複数行__0']?.value || '';
  // ★中身があるのに読めない時は、空として扱わず必ず失敗させる。
  //   空で上書きすると、これまでの判断が全部消えるため。
  if (!raw.trim()) { checkedMap = {}; return; }
  try { checkedMap = JSON.parse(raw) || {}; }
  catch (e) { throw new Error('確認済みの記録が壊れています。保存せずに管理者へ連絡してください。'); }
}

async function saveChecked() {
  const body = { '文字列__複数行__0': { value: JSON.stringify(checkedMap, null, 2) } };
  if (checkedRecId) {
    const res = await fetch(`${PROXY}/k/v1/record.json?subdomain=${DOMAIN}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON },
      body: JSON.stringify({ app: APP_NOHON, id: checkedRecId, record: body })
    });
    if (!res.ok) throw new Error(`保存に失敗しました（${res.status}）`);
  } else {
    const res = await fetch(`${PROXY}/k/v1/record.json?subdomain=${DOMAIN}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON },
      body: JSON.stringify({ app: APP_NOHON, record: Object.assign({ '文字列__1行_': { value: CHECKED_KEY } }, body) })
    });
    if (!res.ok) throw new Error(`保存に失敗しました（${res.status}）`);
    const d = await res.json();
    checkedRecId = d.id;
  }
}

/* 今月分と設置店マスタを突き合わせる。画面とは切り離してあるので単体で試せる */
function computeDiffs(nohon, master) {
  const mById = new Map();
  master.forEach(m => {
    const sid = sidOf(m, M.id);
    if (validSid(sid)) mById.set(sid, m);
  });

  const nabon = [], osoiByGroup = {}, check = [], memo = [];
  nohon.forEach(r => {
    const sid = sidOf(r, N.sid);
    const m = validSid(sid) ? mById.get(sid) : null;

    // 作業者コメント（見るだけ）。マスタに突き合わない店でも拾う
    if ((r[N.memo]?.value || '').trim()) memo.push({ r });

    if (!m) return;   // マスタに突き合わない店は、ここから先では扱わない

    // マスタが「要確認」＝ 運転手・作業者の画面から消えている店
    if ((m[M.status]?.value || '') === STATUS_CHECK) check.push({ r, m });

    // 通常納本数
    if (numOf(r, N.nabon) !== numOf(m, M.nabon)) {
      nabon.push({ r, m, month: numOf(r, N.nabon), master: numOf(m, M.nabon) });
    }
    // 早/遅はグループ単位でまとめる（割当がグループ単位で効くため）
    const ro = isOsoi(r, N.osoi), mo = isOsoi(m, M.osoi);
    if (ro !== mo) {
      const g = r[N.group]?.value || '（グループなし）';
      (osoiByGroup[g] = osoiByGroup[g] || { g, monthOsoi: ro, items: [] })
        .items.push({ r, m, monthOsoi: ro, masterOsoi: mo });
    }
  });

  return { nabon, osoi: Object.values(osoiByGroup).sort((a, b) => a.g.localeCompare(b.g)), check, memo };
}

async function kget(app, query, fields) {
  const out = [];
  const fp = fields ? fields.map(f => `&fields=${encodeURIComponent(f)}`).join('') : '';
  const token = app === APP_MASTER ? KINTONE_CONFIG.TOKEN_MASTER : KINTONE_CONFIG.TOKEN_NOHON;
  for (let offset = 0; ; offset += 500) {
    const q = encodeURIComponent(`${query} limit 500 offset ${offset}`.trim());
    const res = await fetch(`${PROXY}/k/v1/records.json?app=${app}&query=${q}${fp}&subdomain=${DOMAIN}`, {
      headers: { 'X-Cybozu-API-Token': token }
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.message || `取得に失敗しました（${res.status}）`);
    }
    const batch = (await res.json()).records || [];
    out.push(...batch);
    if (batch.length < 500) break;
  }
  return out;
}

async function kput(app, records) {
  const token = app === APP_MASTER ? KINTONE_CONFIG.TOKEN_MASTER : KINTONE_CONFIG.TOKEN_NOHON;
  for (let i = 0; i < records.length; i += 100) {
    const res = await fetch(`${PROXY}/k/v1/records.json?subdomain=${DOMAIN}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Cybozu-API-Token': token },
      body: JSON.stringify({ app, records: records.slice(i, i + 100) })
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`更新に失敗しました（${res.status}）：${t.slice(0, 200)}`);
    }
  }
}

/* ===== 読み込みと突き合わせ ===== */
async function load() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中…</div>';
  const month = document.getElementById('month-sel').value;
  try {
    await loadChecked();
    const [nohon, master] = await Promise.all([
      kget(APP_NOHON, `${N.month} = "${month}" order by ${N.route} asc, 数値_1 asc`,
        ['$id', N.sid, N.name, N.bldg, N.floor, N.route, N.group, N.nabon, N.osoi, N.memo, N.status]),
      kget(APP_MASTER, 'order by $id asc',
        ['$id', M.id, M.name, M.nabon, M.osoi, M.status, M.genre, M.route, M.freq]),
    ]);

    // ドロップダウンの選択肢は、実際に使われている値から作る。
    // kintoneに無い値を書き込むとエラーになるため、勝手な候補は出さない。
    choices = {
      genre:  uniq(master.map(m => m[M.genre]?.value)),
      route:  uniq(master.map(m => m[M.route]?.value)),
      status: uniq(master.map(m => m[M.status]?.value)),
      freq:   uniq(master.map(m => m[M.freq]?.value)),
    };
    masterBySid = new Map();
    master.forEach(m => {
      const sid = sidOf(m, M.id);
      if (validSid(sid)) masterBySid.set(sid, m);
    });

    data = Object.assign({ month }, splitChecked(computeDiffs(nohon, master), month));
    render();
  } catch (e) {
    el.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ===== 表示 ===== */
function render() {
  const d = data;
  // 判断待ち＝マスタと食い違っているもの＋まだ見ていない要確認の店
  const waiting = d.nabon.length + d.osoi.length + d.check.length;
  const el = document.getElementById('content');

  el.innerHTML = `
    <div class="summary">
      <div class="sm ${waiting ? 'hot' : ''}">
        <div class="n" style="color:${waiting ? 'var(--red)' : 'var(--green)'}">${waiting}</div>
        <div class="l">判断待ち</div>
      </div>
      <div class="sm"><div class="n">${d.nabon.length}</div><div class="l">通常納本数の違い</div></div>
      <div class="sm"><div class="n">${d.osoi.length}</div><div class="l">早/遅の違い（グループ）</div></div>
      <div class="sm ${d.check.length ? 'hot' : ''}">
        <div class="n" style="color:${d.check.length ? 'var(--red)' : 'inherit'}">${d.check.length}</div>
        <div class="l">要確認の店${d.checkDone.length ? `<br><span style="font-size:10px">（確認済み ${d.checkDone.length}）</span>` : ''}</div>
      </div>
      <div class="sm"><div class="n">${d.memo.length}</div><div class="l">コメント付きの店</div></div>
    </div>

    ${secNabon()}
    ${secOsoi()}
    ${secCheck()}
    ${secMemo()}`;
}

// 設置店マスタを直すボタン。突き合わせできない店（設置場所IDが無い等）には出さない
function editBtn(r) {
  const sid = sidOf(r, N.sid);
  if (!validSid(sid) || !masterBySid.has(sid)) {
    return `<span style="font-size:10px;color:var(--muted);">設置場所IDが無いためマスタと突き合わせできません</span>`;
  }
  return `<button class="b revert" onclick="openMasterEdit('${esc(sid)}')">✏️ 設置店マスタを修正</button>`;
}

function shopLine(r) {
  const bldg = r[N.bldg]?.value || '';
  const fl = r[N.floor]?.value || '';
  const g = r[N.group]?.value || '';
  return `<div class="nm">${esc(r[N.name]?.value || '(店名なし)')}</div>
    <div class="meta">${esc(bldg)}${fl ? ` ${esc(fl)}階` : ''}${g ? ` / グループ ${esc(g)}` : ''}</div>`;
}

function secNabon() {
  const rows = data.nabon.map((x, i) => `
    <div class="row" id="nabon-${i}">
      ${shopLine(x.r)}
      <div class="vals">
        <span class="v month">今月分 ${x.month}冊</span>
        <span class="arrow">↔</span>
        <span class="v master">マスタ ${x.master}冊</span>
      </div>
      <div class="acts">
        <button class="b apply" onclick="applyNabon(${i})">マスタを ${x.month}冊 にする</button>
        <button class="b revert" onclick="revertNabon(${i})">今月分を ${x.master}冊 に戻す</button>
        ${editBtn(x.r)}
      </div>
    </div>`).join('');
  return `
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">📦 通常納本数の違い</div>
        <span class="cnt ${data.nabon.length ? '' : 'zero'}">${data.nabon.length}</span>
        ${data.nabon.length ? `<button class="b bulk" onclick="bulkNabon()">すべてマスタに反映</button>` : ''}
      </div>
      <div class="sec-note">作業中に今月分の通常納本数を直した店です。マスタに反映するか、今月限りとして元に戻すかを選んでください。</div>
      <div class="sec-body">${rows || '<div class="empty">違いはありません</div>'}</div>
    </div>`;
}

function secOsoi() {
  const rows = data.osoi.map((x, i) => {
    const names = x.items.map(it => esc(it.r[N.name]?.value || '')).join('、');
    const toMonth = x.items[0].monthOsoi;
    return `
    <div class="row" id="osoi-${i}">
      <div class="nm">グループ ${esc(x.g)}<span style="font-weight:400;color:var(--muted);font-size:11px"> / ${x.items.length}店</span></div>
      <div class="vals">
        <span class="v month">今月分 ${toMonth ? '🌙 遅' : '☀️ 早'}</span>
        <span class="arrow">↔</span>
        <span class="v master">マスタ ${toMonth ? '☀️ 早' : '🌙 遅'}</span>
      </div>
      <div class="stores">${names}</div>
      <div class="acts">
        <button class="b apply" onclick="applyOsoi(${i})">マスタを「${toMonth ? '遅' : '早'}」にする</button>
        <button class="b revert" onclick="revertOsoi(${i})">今月分をマスタに戻す</button>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">🌙 早/遅の違い</div>
        <span class="cnt ${data.osoi.length ? '' : 'zero'}">${data.osoi.length}</span>
        ${data.osoi.length ? `<button class="b bulk" onclick="bulkOsoi()">すべてマスタに反映</button>` : ''}
      </div>
      <div class="sec-note">
        作業中に今月分の早/遅を直した店です（グループ単位でまとめています）。<br>
        <strong>グループ内に1店でも遅があると、そのグループ全体が遅として割り当てられます。</strong>
      </div>
      <div class="sec-body">${rows || '<div class="empty">違いはありません</div>'}</div>
    </div>`;
}

function secCheck() {
  const rows = data.check.map((x, i) => `
    <div class="row" id="check-${i}">
      ${shopLine(x.r)}
      <div class="vals"><span class="v master" style="background:#fde8e8;color:#b01818;">マスタ：要確認</span></div>
      <div class="sec-note" style="padding:6px 0 0;">今月分のレコードは残っていますが、運転手・作業者の画面には出ていません。</div>
      <div class="acts">
        <button class="b back" onclick="backToActive(${i})">稼働中に戻す</button>
        <button class="b apply" onclick="keepNeedsCheck(${i})">このままにする（確認済み）</button>
        ${editBtn(x.r)}
      </div>
    </div>`).join('');

  // 「このままにする」を押した店。普段は畳んでおき、戻せるようにしておく
  const doneRows = data.checkDone.map((x, i) => `
    <div class="row" style="opacity:.65">
      ${shopLine(x.r)}
      <div class="vals">
        <span class="v master" style="background:#fde8e8;color:#b01818;">マスタ：要確認</span>
        <span class="v" style="background:#e8f7ee;color:var(--green)">✓ 確認済み</span>
      </div>
      <div class="acts"><button class="b revert" onclick="unkeepNeedsCheck(${i})">確認済みを取り消す</button></div>
    </div>`).join('');

  return `
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">⚠️ 要確認にした店</div>
        <span class="cnt ${data.check.length ? '' : 'zero'}">${data.check.length}</span>
        ${data.checkDone.length ? `<button class="b revert" onclick="toggleCheckDone()">${
          showChecked ? '確認済みを隠す' : `確認済み ${data.checkDone.length}件を見る`}</button>` : ''}
      </div>
      <div class="sec-note">
        作業中に「営業していない」として要確認にした店です。<br>
        確認がとれて戻すなら<strong>「稼働中に戻す」</strong>、このまま要確認で置いておくなら
        <strong>「このままにする」</strong>を押してください。どちらを押しても一覧から消えます。
      </div>
      <div class="sec-body">
        ${rows || '<div class="empty">判断待ちはありません</div>'}
        ${showChecked && doneRows ? `<div class="fsec" style="font-size:11px;font-weight:900;color:var(--muted);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);">確認済み</div>${doneRows}` : ''}
      </div>
    </div>`;
}

function toggleCheckDone() { showChecked = !showChecked; render(); }

/* このまま要確認で置いておく。記録しておき、一覧からは消す */
function keepNeedsCheck(i) {
  const x = data.check[i];
  const sid = sidOf(x.r, N.sid);
  if (!sid) { alert('設置場所IDが無いため、確認済みにできません。'); return; }
  if (!confirm(`${x.r[N.name]?.value} を「このまま要確認にしておく」として記録します。\n\n`
    + `${data.month} の一覧からは消えます。設置店マスタは変わりません。\n\n`
    + `翌月号では、また判断待ちとして出ます。\n\nよろしいですか？`)) return;
  run('記録', async () => {
    if (!checkedMap[data.month]) checkedMap[data.month] = {};
    checkedMap[data.month][sid] = new Date().toISOString();
    await saveChecked();
  });
}

function unkeepNeedsCheck(i) {
  const x = data.checkDone[i];
  const sid = sidOf(x.r, N.sid);
  run('取り消し', async () => {
    if (checkedMap[data.month]) delete checkedMap[data.month][sid];
    await saveChecked();
  });
}

function secMemo() {
  const rows = data.memo.map(x => `
    <div class="row">
      ${shopLine(x.r)}
      <div class="memo">📝 ${esc(x.r[N.memo].value)}</div>
      <div class="acts">${editBtn(x.r)}</div>
    </div>`).join('');
  return `
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">📝 コメントが付いた店</div>
        <span class="cnt ${data.memo.length ? '' : 'zero'}">${data.memo.length}</span>
      </div>
      <div class="sec-note">
        作業者が現場で残したコメントです。内容を見て設置店マスタを直す必要があれば、
        <strong>その場で修正できます</strong>（kintoneを開かなくて構いません）。
      </div>
      <div class="sec-body">${rows || '<div class="empty">ありません</div>'}</div>
    </div>`;
}

/* ===== 反映・取り消し ===== */
async function run(label, fn) {
  try {
    await fn();
    await load();
  } catch (e) {
    alert(`${label}に失敗しました。\n\n${e.message}`);
  }
}

function applyNabon(i) {
  const x = data.nabon[i];
  if (!confirm(`設置店マスタの通常納本数を ${x.month}冊 にします。\n\n${x.r[N.name]?.value}\n\nよろしいですか？`)) return;
  run('反映', () => kput(APP_MASTER, [{ id: x.m.$id.value, record: { [M.nabon]: { value: String(x.month) } } }]));
}
function revertNabon(i) {
  const x = data.nabon[i];
  if (!confirm(`今月分の通常納本数を ${x.master}冊 に戻します（マスタは変えません）。\n\n${x.r[N.name]?.value}\n\nよろしいですか？`)) return;
  run('取り消し', () => kput(APP_NOHON, [{ id: x.r.$id.value, record: { [N.nabon]: { value: String(x.master) } } }]));
}
function bulkNabon() {
  if (!confirm(`通常納本数の違い ${data.nabon.length}件を、すべてマスタに反映します。\n\nよろしいですか？`)) return;
  run('一括反映', () => kput(APP_MASTER,
    data.nabon.map(x => ({ id: x.m.$id.value, record: { [M.nabon]: { value: String(x.month) } } }))));
}

function applyOsoi(i) {
  const x = data.osoi[i];
  const to = x.items[0].monthOsoi;
  if (!confirm(`グループ ${x.g} の ${x.items.length}店について、\n設置店マスタを「${to ? '遅' : '早'}」にします。\n\nよろしいですか？`)) return;
  run('反映', () => kput(APP_MASTER,
    x.items.map(it => ({ id: it.m.$id.value, record: { [M.osoi]: { value: to ? [OSOI] : [] } } }))));
}
function revertOsoi(i) {
  const x = data.osoi[i];
  if (!confirm(`グループ ${x.g} の ${x.items.length}店について、\n今月分をマスタの値に戻します（マスタは変えません）。\n\nよろしいですか？`)) return;
  run('取り消し', () => kput(APP_NOHON,
    x.items.map(it => ({ id: it.r.$id.value, record: { [N.osoi]: { value: it.masterOsoi ? [OSOI] : [] } } }))));
}
function bulkOsoi() {
  if (!confirm(`早/遅の違い ${data.osoi.length}グループを、すべてマスタに反映します。\n\nよろしいですか？`)) return;
  const recs = [];
  data.osoi.forEach(x => {
    const to = x.items[0].monthOsoi;
    x.items.forEach(it => recs.push({ id: it.m.$id.value, record: { [M.osoi]: { value: to ? [OSOI] : [] } } }));
  });
  run('一括反映', () => kput(APP_MASTER, recs));
}

function backToActive(i) {
  const x = data.check[i];
  if (!confirm(`設置店マスタを「稼働中」に戻します。\n\n${x.r[N.name]?.value}\n\n運転手・作業者の画面にまた出るようになります。よろしいですか？`)) return;
  run('変更', () => kput(APP_MASTER, [{ id: x.m.$id.value, record: { [M.status]: { value: STATUS_ACTIVE } } }]));
}

/* ===== 設置店マスタの修正 ===== */
/* 直せる項目。kintoneを直接開かなくても済むように、マスタの主な項目を並べる。
   設置場所ID（突き合わせの鍵）だけは、ここからは直せないようにしてある。 */
const EDIT_FIELDS = [
  { sec:'店の情報' },
  { k:'name',  label:'店名',      type:'text' },
  { k:'bldg',  label:'ビル名',    type:'text' },
  { k:'floor', label:'階数',      type:'text' },
  { k:'genre', label:'ジャンル',  type:'select' },
  { k:'jo',    label:'条',        type:'text', hint:'数字だけなら頭に「南」が付きます。「北2」のような書き方はそのまま使われます' },
  { k:'chome', label:'丁目',      type:'text', hint:'数字だけなら頭に「西」が付きます。「東2」のような書き方はそのまま使われます' },
  { k:'place', label:'設置場所説明', type:'text' },
  { k:'comment', label:'コメント', type:'textarea', hint:'ここは設置店マスタ側のコメントです（作業者が現場で書いたものとは別）' },

  { sec:'作業の設定' },
  { k:'nabon', label:'通常納本数', type:'number' },
  { k:'map',   label:'MAP冊数',   type:'number' },
  { k:'freq',  label:'納本頻度',  type:'select' },
  { k:'time',  label:'時間指定',  type:'text' },
  { k:'osoi',  label:'遅',        type:'check' },
  { k:'rack',  label:'ラック交換', type:'check' },
  { k:'pop',   label:'POP交換',   type:'check' },
  { k:'bundle',label:'束渡し',    type:'check' },
  { k:'refill',label:'要補充',    type:'check' },
  { k:'teikyu',label:'定休日',    type:'check' },
  { k:'status',label:'稼働状況',  type:'select', hint:'「要確認」にすると、運転手・作業者の画面から消えます' },

  { sec:'割当（変えると回る順番が変わります）', warn:true },
  { k:'route', label:'ルート',    type:'select' },
  { k:'order', label:'ルート順',  type:'number' },
  { k:'group', label:'グループ',  type:'text' },
];

function isMapMonth(month) {
  const x = String(month || '').match(/(\d{4})年(\d{1,2})月号/);
  return !!x && [2, 5, 8, 11].includes(parseInt(x[2]));
}

/* チェックボックスの選択肢も実データから集める（kintoneに無い値は書き込めないため） */
function chkChoices(key) {
  const out = new Set();
  masterBySid.forEach(m => (m[M[key]]?.value || []).forEach(v => out.add(v)));
  return [...out].sort();
}

async function openMasterEdit(sid) {
  const brief = masterBySid.get(sid);
  if (!brief) { alert('この店は設置店マスタに見つかりませんでした。'); return; }
  const body = document.getElementById('edit-body');
  document.getElementById('edit-modal').classList.add('open');
  body.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中…</div>';
  try {
    // 編集には全項目が要るので、その1件だけ取り直す
    const recs = await kget(APP_MASTER, `$id = ${brief.$id.value}`);
    if (!recs.length) throw new Error('設置店マスタのレコードが見つかりませんでした。');
    const mrec = recs[0];
    const nrec = data.memo.map(x => x.r).find(r => sidOf(r, N.sid) === sid)
      || data.nabon.map(x => x.r).find(r => sidOf(r, N.sid) === sid) || null;
    editing = { sid, mrec, nrec };
    document.getElementById('edit-title').textContent =
      `設置店マスタを修正：${mrec[M.name]?.value || ''}`;
    body.innerHTML = buildEditForm(mrec);
  } catch (e) {
    body.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function buildEditForm(m) {
  let html = '';
  EDIT_FIELDS.forEach(f => {
    if (f.sec) {
      html += `<div class="fsec${f.warn ? ' warn' : ''}">${esc(f.sec)}</div>`;
      if (f.warn) html += `<div class="warnbox">ここを変えると、その店が回る順番や担当する車が変わります。内容をよく確かめてから保存してください。</div>`;
      return;
    }
    const code = M[f.k];
    const cur = m[code]?.value;
    let input = '';
    if (f.type === 'select') {
      const list = (choices[f.k] || []).slice();
      const now = String(cur ?? '');
      if (now && !list.includes(now)) list.unshift(now);
      input = `<select id="ef-${f.k}">${['', ...list].map(v =>
        `<option value="${esc(v)}"${v === now ? ' selected' : ''}>${v === '' ? '（空）' : esc(v)}</option>`).join('')}</select>`;
    } else if (f.type === 'check') {
      const opts = chkChoices(f.k);
      const on = cur || [];
      if (!opts.length) {
        input = `<div class="chks"><span style="font-size:11px;color:var(--muted)">この項目は現在どの店でも使われていないため、ここからは変えられません</span></div>`;
      } else {
        input = `<div class="chks" id="ef-${f.k}">${opts.map(o =>
          `<label><input type="checkbox" value="${esc(o)}"${on.includes(o) ? ' checked' : ''}> ${esc(o)}</label>`).join('')}</div>`;
      }
    } else if (f.type === 'textarea') {
      input = `<textarea id="ef-${f.k}">${esc(cur || '')}</textarea>`;
    } else {
      input = `<input type="${f.type === 'number' ? 'number' : 'text'}" id="ef-${f.k}" value="${esc(cur ?? '')}">`;
    }
    html += `<div class="f"><label>${esc(f.label)}</label>${input}`
      + (f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '') + `</div>`;
  });
  return html;
}

/* 入力欄から値を読む。チェックボックスは配列、それ以外は文字列 */
function readEdit(f) {
  const el = document.getElementById('ef-' + f.k);
  if (!el) return null;   // 変えられない項目
  if (f.type === 'check') {
    return [...el.querySelectorAll('input[type=checkbox]')].filter(c => c.checked).map(c => c.value);
  }
  return el.value;
}

function sameVal(a, b) {
  if (Array.isArray(a) || Array.isArray(b)) {
    const x = (a || []).slice().sort(), y = (b || []).slice().sort();
    return x.length === y.length && x.every((v, i) => v === y[i]);
  }
  return String(a ?? '').trim() === String(b ?? '').trim();
}

async function saveMasterEdit() {
  if (!editing) return;
  const { mrec, nrec } = editing;
  const btn = document.getElementById('edit-save');

  // 変わったところだけ送る
  const mPatch = {}, changed = [];
  EDIT_FIELDS.forEach(f => {
    if (f.sec) return;
    const v = readEdit(f);
    if (v === null) return;
    const code = M[f.k];
    const before = mrec[code]?.value;
    if (sameVal(v, before)) return;
    mPatch[code] = { value: f.type === 'check' ? v : String(v) };
    changed.push(`${f.label}：${fmt(before)} → ${fmt(v)}`);
  });

  if (!changed.length) { alert('変更がありません。'); return; }

  const sync = document.getElementById('edit-sync').checked && !!nrec;
  if (!confirm(`設置店マスタを更新します。\n\n${changed.join('\n')}\n\n`
    + (sync ? `今月分（${data.month}）にも同じ内容を書き写します。\n\n` : '')
    + 'よろしいですか？')) return;

  btn.disabled = true;
  try {
    await kput(APP_MASTER, [{ id: mrec.$id.value, record: mPatch }]);

    // 今月分にも書き写す（画面の表示は今月分を見ているため）
    if (sync) {
      const after = {};
      EDIT_FIELDS.forEach(f => { if (!f.sec) { const v = readEdit(f); if (v !== null) after[f.k] = v; } });
      const nPatch = {};
      MAP_TO_MONTH.forEach(x => {
        if (!(x.m in after)) return;
        if (!(M[x.m] in mPatch)) return;             // 変えていない項目は触らない
        const v = after[x.m];
        nPatch[x.n] = { value: x.chk ? v : (x.num ? String(parseFloat(v) || 0) : String(v)) };
      });
      // MAP冊数は発行月のルールがあるので、頻度を見てから決める
      if (M.map in mPatch || M.freq in mPatch) {
        const freq = String(after.freq ?? mrec[M.freq]?.value ?? '').trim();
        const mapv = String(after.map ?? mrec[M.map]?.value ?? '').trim();
        nPatch['数値_3'] = { value: (freq === FREQ_MAP_ISSUE_ONLY && !isMapMonth(data.month))
          ? '0' : String(parseFloat(mapv) || 0) };
      }
      // 住所は「条-丁目」に組み立て直す
      if (M.jo in mPatch || M.chome in mPatch) {
        const jo = String(after.jo ?? mrec[M.jo]?.value ?? '').trim();
        const ch = String(after.chome ?? mrec[M.chome]?.value ?? '').trim();
        nPatch['文字列__1行__8'] = { value: (jo && ch) ? `${jo}-${ch}` : (jo || ch || '') };
      }
      if (Object.keys(nPatch).length) await kput(APP_NOHON, [{ id: nrec.$id.value, record: nPatch }]);
    }

    closeMasterEdit();
    await load();
  } catch (e) {
    alert(`保存に失敗しました。\n\n${e.message}`);
    btn.disabled = false;
  }
}

function fmt(v) {
  if (Array.isArray(v)) return v.length ? v.join('・') : '（なし）';
  const t = String(v ?? '').trim();
  return t === '' ? '（空）' : t;
}

function closeMasterEdit() {
  document.getElementById('edit-modal').classList.remove('open');
  document.getElementById('edit-save').disabled = false;
  editing = null;
}

/* ===== 起動 ===== */
(async function init() {
  await initMonth();
  await load();
})();
</script>
