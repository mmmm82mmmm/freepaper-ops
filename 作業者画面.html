<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作業画面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f0e8; --card:#fff; --ink:#1a1a1a; --muted:#888;
  --border:#e0dbd0; --green:#1a8a4a; --amber:#c47a0a;
  --blue:#1a5cd4; --red:#d42020;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:120px;}

/* HEADER */
.app-header{background:var(--ink);color:white;padding:14px 16px 12px;position:sticky;top:0;z-index:100;}
.app-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.app-title{font-size:15px;font-weight:900;}
.worker-name{font-size:12px;background:#333;padding:4px 10px;border-radius:20px;font-weight:700;}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-bar-bg{flex:1;height:5px;background:#333;border-radius:3px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.5s;}
.progress-text{font-family:'DM Mono',monospace;font-size:11px;color:#aaa;white-space:nowrap;}
.text-size-btn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;min-width:36px;}
.text-size-btn:active{background:rgba(255,255,255,.3);}

/* ===== 大きい文字モード（老眼対応） ===== */
/* サイズ大 (+30%) */
body.text-large .shop-name{font-size:22px;}
body.text-large .shop-location{font-size:16px;line-height:1.6;}
body.text-large .shop-location::before{font-size:16px;}
body.text-large .shop-comment{font-size:15px;line-height:1.6;}
body.text-large .nabon-hint{font-size:15px;}
body.text-large .nabon-hint strong{font-size:20px;}
body.text-large .input-group label{font-size:13px;}
body.text-large .input-group input{font-size:26px;padding:14px;}
body.text-large .status-pill{font-size:14px;padding:6px 12px;}
body.text-large .meta-chip{font-size:14px;padding:3px 10px;}
body.text-large .group-name{font-size:17px;}
body.text-large .group-count{font-size:14px;}
body.text-large .group-badge{font-size:14px;padding:4px 10px;}
body.text-large .app-title{font-size:19px;}
body.text-large .worker-name{font-size:15px;padding:5px 12px;}
body.text-large .progress-text{font-size:14px;}
body.text-large .btn-done, body.text-large .btn-absent{font-size:16px;padding:14px;}
body.text-large .btn-return{font-size:17px;padding:16px;}
body.text-large .btn-modal-confirm{font-size:16px;}

/* サイズ特大 (+60%) */
body.text-xlarge .shop-name{font-size:27px;}
body.text-xlarge .shop-location{font-size:19px;line-height:1.6;}
body.text-xlarge .shop-location::before{font-size:19px;}
body.text-xlarge .shop-comment{font-size:18px;line-height:1.6;}
body.text-xlarge .nabon-hint{font-size:18px;}
body.text-xlarge .nabon-hint strong{font-size:24px;}
body.text-xlarge .input-group label{font-size:15px;}
body.text-xlarge .input-group input{font-size:32px;padding:18px;}
body.text-xlarge .status-pill{font-size:16px;padding:7px 14px;}
body.text-xlarge .meta-chip{font-size:16px;padding:4px 12px;}
body.text-xlarge .group-name{font-size:20px;}
body.text-xlarge .group-count{font-size:16px;}
body.text-xlarge .group-badge{font-size:16px;padding:5px 12px;}
body.text-xlarge .app-title{font-size:22px;}
body.text-xlarge .worker-name{font-size:17px;padding:6px 14px;}
body.text-xlarge .progress-text{font-size:16px;}
body.text-xlarge .btn-done, body.text-xlarge .btn-absent{font-size:19px;padding:17px;}
body.text-xlarge .btn-return{font-size:20px;padding:20px;}
body.text-xlarge .btn-modal-confirm{font-size:19px;}

/* LOGIN */
.login-screen{max-width:400px;margin:60px auto 0;padding:24px;}
.login-title{font-size:22px;font-weight:900;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.login-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;}
.login-select{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:16px;background:var(--bg);margin-bottom:16px;-webkit-appearance:none;}
.login-select:focus{outline:none;border-color:var(--blue);background:white;}
.btn-login{width:100%;padding:16px;background:var(--ink);color:white;border:none;border-radius:12px;font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:900;cursor:pointer;transition:all .2s;}
.btn-login:active{transform:scale(.98);}
.btn-login:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}

/* LOADING */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--muted);}

/* ERROR */
.error-box{margin:20px 16px;padding:16px;background:#fde8e8;border:1px solid #f0a0a0;border-radius:10px;font-size:13px;color:var(--red);line-height:1.6;}

/* GROUP HEADER */
.group-header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:68px;z-index:90;}
.group-badge{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;background:var(--ink);color:white;padding:3px 8px;border-radius:4px;}
.group-name{font-size:13px;font-weight:700;}
.group-count{font-size:11px;color:var(--muted);margin-left:auto;}

/* CARD */
.shop-card{background:var(--card);margin:10px 12px;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);border:2px solid transparent;transition:border-color .2s;animation:slideIn .2s ease;}
.shop-card.status-done{border-color:var(--green);}
.shop-card.status-absent{border-color:var(--amber);}
.shop-card.status-active{border-color:var(--blue);}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card-header{padding:12px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-header-left{flex:1;min-width:0;}
.shop-name{font-size:17px;font-weight:900;line-height:1.2;}
.shop-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.meta-chip{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);font-weight:500;}
.meta-chip.floor{background:#e8f0ff;color:var(--blue);font-weight:700;}
.meta-chip.genre{background:#f5f0e8;color:#8a7060;}
.meta-chip.closed{background:#fff3e0;color:var(--amber);font-weight:700;}
.status-pill{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pill-todo{background:#f0ede8;color:var(--muted);}
.pill-done{background:#d4f5e2;color:var(--green);}
.pill-absent{background:#fef3d0;color:var(--amber);}
.pill-active{background:#e0eaff;color:var(--blue);}

.shop-location{padding:0 14px 10px;font-size:13px;color:#555;display:flex;align-items:flex-start;gap:6px;line-height:1.5;}
.shop-location::before{content:'📍';font-size:13px;flex-shrink:0;}
.shop-comment{margin:0 14px 10px;padding:8px 10px;background:#fff8e8;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:12px;color:#7a5a00;line-height:1.5;}
.nabon-hint{margin:0 14px 10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.nabon-hint strong{font-family:'DM Mono',monospace;font-size:16px;color:var(--ink);font-weight:500;}

/* INPUT */
.input-area{padding:0 14px 14px;}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.input-group label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.input-group input{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:20px;font-weight:500;text-align:center;background:var(--bg);color:var(--ink);transition:border-color .15s;-webkit-appearance:none;}
.input-group input:focus{outline:none;border-color:var(--blue);background:white;}

/* DYNAMIC */
.dynamic-section{margin:0 14px 12px;background:#f8f5ff;border:1px solid #d8d0f0;border-radius:8px;overflow:hidden;}
.dynamic-section-title{padding:7px 12px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6040b0;background:#ede8ff;border-bottom:1px solid #d8d0f0;}
.dynamic-item{padding:10px 12px;border-bottom:1px solid #ede8ff;display:flex;align-items:center;gap:10px;}
.dynamic-item:last-child{border-bottom:none;}
.dynamic-label{font-size:13px;font-weight:700;flex:1;}
.dynamic-sublabel{font-size:11px;color:var(--muted);margin-top:1px;}
.toggle-group{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.toggle-btn{padding:6px 10px;border-radius:6px;border:2px solid var(--border);font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:700;cursor:pointer;background:white;color:var(--muted);transition:all .15s;}
.toggle-btn:active{transform:scale(.95);}
.toggle-btn.sel-ok{background:var(--blue);color:white;border-color:var(--blue);}
.toggle-btn.sel-ng{background:#f0ede8;color:var(--muted);border-color:var(--border);}
.toggle-btn.sel-yes{background:var(--green);color:white;border-color:var(--green);}
.toggle-btn.sel-no{background:#fde8e8;color:var(--red);border-color:var(--red);}
.toggle-btn.sel-later{background:#fff3e0;color:var(--amber);border-color:var(--amber);}

/* ABSENT */
.absent-times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.absent-time-group label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.absent-time-group input{width:100%;padding:8px 6px;border:2px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:14px;text-align:center;background:var(--bg);}
.absent-time-group input:focus{outline:none;border-color:var(--amber);background:white;}
.absent-overlay{padding:14px;background:#fffbf0;border-top:1px solid #ffe8a0;}
.absent-label{font-size:12px;color:var(--amber);font-weight:700;margin-bottom:4px;}
.absent-times-display{font-family:'DM Mono',monospace;font-size:13px;}

/* BUTTONS */
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.btn-action{padding:13px;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s;}
.btn-action:active{transform:scale(.97);}
.btn-complete{background:var(--green);color:white;grid-column:1/-1;padding:15px;font-size:15px;}
.btn-complete:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;}
.btn-absent{background:#fff3e0;color:var(--amber);border:2px solid var(--amber);}
.btn-reset{background:var(--bg);color:var(--muted);border:2px solid var(--border);}

.done-overlay{padding:14px;display:flex;align-items:center;gap:10px;background:#f0faf5;}
.done-icon{font-size:24px;}
.done-info{flex:1;}
.done-label{font-size:12px;color:var(--green);font-weight:700;}
.done-vals{font-family:'DM Mono',monospace;font-size:13px;margin-top:2px;}

.memo-area{margin:0 14px 14px;}
.memo-area label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.memo-area textarea{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:13px;background:var(--bg);resize:none;height:60px;}
.memo-area textarea:focus{outline:none;border-color:var(--blue);background:white;}

/* 車に戻るボタン */
.return-footer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 28px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:200;}
.btn-return{width:100%;padding:16px;background:var(--ink);color:white;border:none;border-radius:14px;font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .2s;}
.btn-return:active{transform:scale(.98);}
.btn-return.all-done{background:var(--green);}
.return-sub{font-size:11px;font-weight:500;opacity:.65;}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-sheet{background:white;width:100%;border-radius:20px 20px 0 0;padding:24px 20px 40px;transform:translateY(100%);transition:transform .3s ease;}
.modal-overlay.show .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.6;}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.modal-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center;}
.modal-stat .val{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;display:block;}
.modal-stat .lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.modal-stat.green .val{color:var(--green);}
.modal-stat.amber .val{color:var(--amber);}
.modal-stat.muted .val{color:var(--muted);}
.modal-warning{background:#fff8e8;border:1px solid #ffe0a0;border-radius:8px;padding:10px 14px;font-size:12px;color:#7a5a00;margin-bottom:16px;line-height:1.6;}
.modal-btn-group{display:flex;flex-direction:column;gap:10px;}
.btn-modal-confirm{padding:16px;border:none;border-radius:12px;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:900;cursor:pointer;background:var(--ink);color:white;transition:all .15s;}
.btn-modal-confirm:active{transform:scale(.98);}
.btn-modal-cancel{padding:14px;border:2px solid var(--border);border-radius:12px;background:none;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;}

/* 送信中スピナー */
.sending{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen" style="padding:0 0 40px">
  <div class="app-header" style="position:relative">
    <div class="app-header-top">
      <div class="app-title">📦 フリーペーパー作業</div>
    </div>
    <div style="font-size:11px;color:#888;margin-top:4px">すすきのフリーク</div>
  </div>
  <div style="max-width:400px;margin:40px auto 0;padding:0 20px">
    <div style="font-size:22px;font-weight:900;margin-bottom:6px">おはようございます！</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:32px;line-height:1.6">お名前を選んで作業を開始してください</div>
    <label class="login-label">お名前</label>
    <select class="login-select" id="worker-select">
      <option value="">-- 選択してください --</option>
    </select>
    <div style="margin-top:8px;background:#e8f0ff;border:2px solid var(--blue);border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:10px;color:var(--muted);">作業月</div>
      <div style="font-size:18px;font-weight:900;color:var(--blue);" id="login-month-display">読込中...</div>
    </div>
    <button class="btn-login" id="btn-login" onclick="startWork()" disabled>作業を開始する →</button>
    <div id="login-error" class="error-box" style="display:none"></div>
  </div>
</div>

<!-- ローディング画面 -->
<div id="loading-screen" style="display:none">
  <div class="app-header" style="position:relative">
    <div class="app-header-top">
      <div class="app-title">📦 フリーペーパー作業</div>
    </div>
  </div>
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">担当場所を読み込んでいます...</div>
  </div>
</div>

<!-- 作業画面 -->
<div id="work-screen" style="display:none">
  <div class="app-header">
    <div class="app-header-top">
      <div class="app-title" id="work-title">📦 2026年5月号</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="text-size-btn" onclick="cycleTextSize()" title="文字サイズ変更" id="text-size-btn-work">A</button>
        <button onclick="refreshNow()" title="再読み込み" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:14px;cursor:pointer;">🔄</button>
        <div class="worker-name" id="work-worker">田中 さん</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="progress-text" id="prog-text">0 / 0 完了</div>
    </div>
  </div>
  <div id="cards-container"></div>
</div>

<!-- 車に戻るボタン -->
<div class="return-footer" id="return-footer" style="display:none">
  <button class="btn-return" id="btn-return" onclick="showReturnModal()">
    <span>🚐</span>
    <span>車に戻る <span class="return-sub" id="return-sub">（読み込み中）</span></span>
  </button>
</div>

<!-- 待機画面 -->
<div id="waiting-screen" style="display:none">
  <div class="app-header" style="position:relative">
    <div class="app-header-top">
      <div class="app-title">📦 フリーペーパー作業</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="text-size-btn" onclick="cycleTextSize()" title="文字サイズ変更" id="text-size-btn-wait">A</button>
        <button onclick="refreshNow()" title="再読み込み" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:14px;cursor:pointer;">🔄</button>
        <div class="worker-name" id="waiting-worker-name"></div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:20px;padding:24px;text-align:center;">
    <div style="font-size:48px">🚐</div>
    <div style="font-size:22px;font-weight:900">お疲れ様でした！</div>
    <div style="font-size:14px;color:var(--muted);line-height:1.8" id="waiting-msg">戻りを報告しました。<br>運転手が次のグループを割り当て中です...</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:8px" id="waiting-spinner-wrap">
      <div class="spinner"></div>
      <div style="font-size:13px;color:var(--muted)">割当を待っています</div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:16px">次のグループ: <strong id="waiting-group" style="font-family:'DM Mono',monospace;color:var(--ink)">待機中</strong></div>

    <!-- 受付停止トグル -->
    <div style="margin-top:24px;width:100%;max-width:320px;">
      <button id="pause-toggle" onclick="togglePause()" style="width:100%;padding:14px;background:#f5f5f0;color:#1a1a1a;border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">
        ⏸️ 受付を一時停止する
      </button>
      <div id="pause-help" style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">
        電話対応・トイレなどで席を外す時に押してください。<br>停止中は次の割当が来ません。
      </div>
    </div>

    <!-- 手動更新ボタン -->
    <div style="margin-top:16px;width:100%;max-width:320px;">
      <button onclick="refreshNow()" style="width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">
        🔄 今すぐ更新（割当の確認）
      </button>
    </div>

    <div id="driver-location-area" style="display:none;margin-top:8px;">

const TEXT_SIZE_STORAGE = 'fp_text_size';
const TEXT_SIZES = ['normal', 'large', 'xlarge']; // 通常 → 大 → 特大 → 通常...
const TEXT_SIZE_LABELS = { normal: 'A', large: 'A+', xlarge: 'A++' };

function applyTextSize(size) {
  document.body.classList.remove('text-large', 'text-xlarge');
  if (size === 'large') document.body.classList.add('text-large');
  else if (size === 'xlarge') document.body.classList.add('text-xlarge');
  const label = TEXT_SIZE_LABELS[size] || 'A';
  document.querySelectorAll('.text-size-btn').forEach(b => b.textContent = label);
  localStorage.setItem(TEXT_SIZE_STORAGE, size);
}

function cycleTextSize() {
  const current = localStorage.getItem(TEXT_SIZE_STORAGE) || 'normal';
  const idx = TEXT_SIZES.indexOf(current);
  const next = TEXT_SIZES[(idx + 1) % TEXT_SIZES.length];
  applyTextSize(next);
  // 一度だけヘルプメッセージ表示（初回のみ）
  if (!localStorage.getItem('fp_text_size_hinted')) {
    setTimeout(() => alert('💡 文字サイズを変更しました\n\n通常(A) → 大(A+) → 特大(A++) の順に切替できます。\nもう一度タップで次のサイズになります。'), 100);
    localStorage.setItem('fp_text_size_hinted', '1');
  }
}

// ===== kintone API =====
async function kintoneGet(appId, token, query, fields = []) {
  const queryEncoded = encodeURIComponent(query);
  let paramStr = `app=${appId}&query=${queryEncoded}&subdomain=${KINTONE_DOMAIN}`;
  if (fields.length) paramStr += `&fields=${fields.map(encodeURIComponent).join(',')}`;
  const res = await fetch(`${BASE}/records.json?${paramStr}`, {
    headers: { 'X-Cybozu-API-Token': token }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`kintone APIエラー: ${res.status} - ${errText}`);
  }
  const data = await res.json();
  return data.records;
}

async function kintoneUpdate(appId, token, id, fields) {
  const res = await fetch(`${BASE}/record.json?subdomain=${KINTONE_DOMAIN}`, {
    method: 'PUT',
    headers: { 'X-Cybozu-API-Token': token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ app: appId, id, record: fields, subdomain: KINTONE_DOMAIN })
  });
  if (!res.ok) throw new Error(`更新エラー: ${res.status}`);
  return await res.json();
}

// ===== 割当JSON操作 =====
async function getAssignState() {
  const records = await kintoneGet(APP_NABON, TOKEN_NABON,
    `文字列__1行_ = "${currentMonth}" order by レコード番号 asc limit 1`);
  if (!records.length) return { assignments: {}, returned: [], updatedAt: '' };
  const raw = records[0]['文字列__複数行__0']?.value || '';
  try { return JSON.parse(raw); } catch(e) { return { assignments: {}, returned: [], updatedAt: '' }; }
}

async function saveAssignState(state) {
  const records = await kintoneGet(APP_NABON, TOKEN_NABON,
    `文字列__1行_ = "${currentMonth}" order by レコード番号 asc limit 1`);
  if (!records.length) throw new Error('割当レコードが見つかりません');
  const recId = records[0]['$id'].value;
  await kintoneUpdate(APP_NABON, TOKEN_NABON, recId, {
    '文字列__複数行__0': { value: JSON.stringify(state, null, 2) }
  });
}

    }

    records = await kintoneGet(APP_NABON, TOKEN_NABON, query);

    // revisitMap (再訪・個別訪問・統合) のレコードも追加
    const revisitIds = [];
    for (const g of assignedGroups) {
      const ids = (state.revisitMap?.[g] || []).map(String);
      revisitIds.push(...ids);
    }
    const uniqueRevisitIds = [...new Set(revisitIds)];
    if (uniqueRevisitIds.length > 0) {
      const idsClause = uniqueRevisitIds.map(id => `"${id}"`).join(',');
      const revisitQuery = `$id in (${idsClause})`;
      const revisitRecords = await kintoneGet(APP_NABON, TOKEN_NABON, revisitQuery);

        if (!existingIds.has(r['$id'].value)) records.push(r);

    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = `⚠️ ${e.message}`;

// ===== カード描画 =====
function renderCards() {
  doneCount = 0; absentCount = 0; todoCount = 0;

  records.forEach(r => {
    const s = r['ドロップダウン']?.value || '未着手';
    if (s === '完了') doneCount++;
    else if (s === '不在') absentCount++;
    else todoCount++;
  });

  updateProgress();

  // グループ別にまとめる
  const groups = {};
  records.forEach(r => {
    const g = r['文字列__1行__0']?.value || r['文字列__1行__2']?.value || 'その他';
    if (!groups[g]) groups[g] = [];
    groups[g].push(r);
  });

  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  updateDriverLocationBar();

  Object.entries(groups).forEach(([groupName, recs]) => {
    // グループヘッダー
    const gh = document.createElement('div');
    gh.className = 'group-header';
    gh.innerHTML = `

}

function openCard(recId) {
  document.getElementById('tap-hint-' + recId).style.display = 'none';
  document.getElementById('input-area-' + recId).style.display = 'block';
  document.getElementById('memo-area-' + recId).style.display = 'block';

// 失敗したリクエストの再試行用ストア
const pendingUpdates = new Map();

async function markDone(recId) {
  const nabon = document.getElementById('nabon-' + recId)?.value || '';
  const henkyaku = document.getElementById('henkyaku-' + recId)?.value || '';
  const memo = document.getElementById('memo-' + recId)?.value || '';

  // 動的項目の値を収集
  const dynamicFields = {};
  DYNAMIC_ITEMS.forEach(item => {
    const selected = document.querySelector(`#toggle-${recId}-${item.key} .toggle-btn[class*="sel-"]`);
    if (selected) dynamicFields[item.key] = { value: selected.textContent.trim() };
  });

  const updateData = {
    'ドロップダウン': { value: '完了' },
    '文字列__1行__10': { value: currentWorker },
    '数値': { value: nabon },
    '数値_0': { value: henkyaku },
    '文字列__複数行_': { value: memo },
    ...dynamicFields
  };

  // === ① 即座にUI更新（楽観的UI） ===
  const card = document.getElementById('card-' + recId);
  card.className = 'shop-card status-done';
  document.getElementById('pill-' + recId).className = 'status-pill pill-done';
  document.getElementById('pill-' + recId).textContent = '✓ 完了';
  card.querySelector('.input-area').outerHTML = `
    <div class="done-overlay" id="overlay-${recId}">
      <div class="done-icon" id="overlay-icon-${recId}">⏳</div>
      <div class="done-info">
        <div class="done-label" id="overlay-label-${recId}">完了（送信中...）</div>
        <div class="done-vals">納本 ${nabon}冊 ／ 返却 ${henkyaku}冊</div>
      </div>
      <button onclick="reopenCard('${recId}')" style="font-size:11px;padding:5px 10px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer;color:#888">修正</button>
    </div>`;
  card.querySelectorAll('.dynamic-section,.memo-area').forEach(el => el.style.display = 'none');

  // ローカルレコード即時更新
  const rec = records.find(r => r['$id'].value == recId);
  if (rec) { rec['ドロップダウン'] = { value: '完了' }; rec['数値'] = { value: nabon }; rec['数値_0'] = { value: henkyaku }; }

  doneCount++; todoCount = Math.max(0, todoCount - 1);
  updateProgress();

  // === ② バックグラウンドで送信 ===
  pendingUpdates.set(recId, updateData);
  sendPendingUpdate(recId, '完了');
}

async function sendPendingUpdate(recId, label) {
  const updateData = pendingUpdates.get(recId);
  if (!updateData) return;
  const iconEl = document.getElementById('overlay-icon-' + recId);
  const labelEl = document.getElementById('overlay-label-' + recId);
  try {
    await kintoneUpdate(APP_NABON, TOKEN_NABON, recId, updateData);
    pendingUpdates.delete(recId);
    if (iconEl) iconEl.textContent = (label === '不在' ? '❌' : '✅');
    if (labelEl) {
      labelEl.style.color = '';
      labelEl.textContent = (label === '不在' ? '不在（送信済み）' : '作業完了（送信済み）');
    }
  } catch(e) {
    if (iconEl) iconEl.textContent = '⚠️';
    if (labelEl) {
      labelEl.style.color = '#d42020';
      labelEl.innerHTML = `送信失敗 <button onclick="retryUpdate('${recId}','${label}')" style="font-size:11px;padding:4px 8px;background:#d42020;color:#fff;border:none;border-radius:4px;margin-left:6px;cursor:pointer;">再送信</button>`;
    }
  }
}

function retryUpdate(recId, label) {
  const iconEl = document.getElementById('overlay-icon-' + recId);
  const labelEl = document.getElementById('overlay-label-' + recId);
  if (iconEl) iconEl.textContent = '⏳';
  if (labelEl) { labelEl.style.color = ''; labelEl.textContent = (label === '不在' ? '不在（再送信中...）' : '完了（再送信中...）'); }
  sendPendingUpdate(recId, label);
}

async function markAbsent(recId) {
  const now = new Date();
  const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  // 既存の不在時間を確認
  const rec = records.find(r => r['$id'].value == recId);
  const t1 = rec?.['文字列__1行__11']?.value || '';
  const t2 = rec?.['文字列__1行__12']?.value || '';
  let newT1 = t1, newT2 = t2, newT3 = '';
  if (!t1) newT1 = t;
  else if (!t2) newT2 = t;
  else newT3 = t;

  const updateData = {
    'ドロップダウン': { value: '不在' },
    '文字列__1行__10': { value: currentWorker },
    '文字列__1行__11': { value: newT1 },
    '文字列__1行__12': { value: newT2 },
    '文字列__1行__13': { value: newT3 },
  };

  // === ① 即座にUI更新（楽観的UI） ===
  const card = document.getElementById('card-' + recId);
  card.className = 'shop-card status-absent';
  document.getElementById('pill-' + recId).className = 'status-pill pill-absent';
  document.getElementById('pill-' + recId).textContent = '不在';
  ['input-area-', 'tap-hint-', 'memo-area-'].forEach(prefix => {
    const el = document.getElementById(prefix + recId);
    if (el) el.style.display = 'none';
  });
  const div = document.createElement('div');
  let absentText = '';
  if (newT1) absentText += `① ${newT1} `;
  if (newT2) absentText += `② ${newT2} `;
  if (newT3) absentText += `③ ${newT3}`;
  div.innerHTML = `
    <div class="absent-overlay" id="overlay-${recId}">
      <div class="absent-label" id="overlay-label-${recId}"><span id="overlay-icon-${recId}">⏳</span> 不在記録（送信中...）</div>
      <div class="absent-times-display">${absentText}</div>
    </div>
    <div style="padding:0 14px 14px">
      <button onclick="reopenCard('${recId}')" style="width:100%;padding:9px;border:2px solid var(--amber);border-radius:8px;background:white;color:var(--amber);font-weight:700;font-size:12px;cursor:pointer">修正・再訪</button>
    </div>`;
  card.appendChild(div);

  if (rec) { rec['ドロップダウン'] = { value: '不在' }; rec['文字列__1行__11'] = { value: newT1 }; rec['文字列__1行__12'] = { value: newT2 }; rec['文字列__1行__13'] = { value: newT3 }; }
  absentCount++; todoCount = Math.max(0, todoCount - 1);
  updateProgress();

  // === ② バックグラウンドで送信 ===
  pendingUpdates.set(recId, updateData);
  try {
    await kintoneUpdate(APP_NABON, TOKEN_NABON, recId, updateData);
    pendingUpdates.delete(recId);
    const ic = document.getElementById('overlay-icon-' + recId);
    const lbl = document.getElementById('overlay-label-' + recId);
    if (ic) ic.textContent = '🚫';
    if (lbl) lbl.innerHTML = `<span id="overlay-icon-${recId}">🚫</span> 不在記録（送信済み）`;
  } catch(e) {
    const ic = document.getElementById('overlay-icon-' + recId);
    const lbl = document.getElementById('overlay-label-' + recId);
    if (ic) ic.textContent = '⚠️';
    if (lbl) {
      lbl.style.color = '#d42020';
      lbl.innerHTML = `<span>⚠️</span> 送信失敗 <button onclick="retryUpdate('${recId}','不在')" style="font-size:11px;padding:4px 8px;background:#d42020;color:#fff;border:none;border-radius:4px;margin-left:6px;cursor:pointer;">再送信</button>`;
    }
  }
}

function reopenCard(recId) {
  // ステータスをリセットして再表示
  const rec = records.find(r => r['$id'].value == recId);
  if (rec) {
    rec['ドロップダウン'] = { value: '未着手' };
    if (rec['ドロップダウン'].value === '完了') doneCount--;
    else if (rec['ドロップダウン'].value === '不在') absentCount--;
    todoCount++;
  }
  renderCards();
}

// ===== 進捗 =====
function updateProgress() {
  const total = records.length;
  const pct = total > 0 ? Math.round(doneCount / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${doneCount} / ${total} 完了`;
  const allDone = (doneCount + absentCount) >= total;
  document.getElementById('btn-return').classList.toggle('all-done', allDone);
  document.getElementById('return-sub').textContent = allDone ? '（全件完了！）' : `（未完了 ${todoCount}件）`;
}

function showReturnModal() {
  document.getElementById('modal-done').textContent = doneCount;
  document.getElementById('modal-absent').textContent = absentCount;
  document.getElementById('modal-todo').textContent = todoCount;
  document.getElementById('waiting-worker-name').textContent = currentWorker + ' さん';

  } else {

}

let isReturning = false; // 車に戻る処理中フラグ（多重タップ・ポーリング競合防止）

async function confirmReturn(withPause) {
  if (isReturning) {
    console.log('既に戻り処理中のため無視');
    return;
  }
  isReturning = true;

  const btn = document.getElementById('btn-modal-confirm');
  const btn2 = document.getElementById('btn-modal-pause');
  const returnBtn = document.getElementById('btn-return');
  btn.disabled = true;
  if (btn2) btn2.disabled = true;
  if (returnBtn) returnBtn.disabled = true; // 車に戻るボタン自体もロック
  const origLabel = btn.textContent;
  btn.textContent = '📤 送信中...';

  // 戻り報告を必ず完了させてから待機画面へ遷移（レース条件回避）
  try {
    await reportReturn(withPause === true);
  } catch(e) {
    console.error('戻り報告エラー:', e);
    alert('戻り報告に失敗しました。通信環境を確認してもう一度お試しください。\n\nエラー: ' + e.message);
    btn.disabled = false;
    if (btn2) btn2.disabled = false;
    if (returnBtn) returnBtn.disabled = false;
    btn.textContent = origLabel;
    isReturning = false;
    return;
  }

  // 保存完了後に画面切替＋ポーリング開始
  closeModal();
  btn.textContent = origLabel;
  showWaitingScreen();
  // 少し待ってからフラグ解除（待機画面のポーリングが安定してから）
  setTimeout(() => { isReturning = false; if (returnBtn) returnBtn.disabled = false; }, 3000);
}

async function reportReturn(withPause) {
  // 1回のGETで取得してすぐPUT
  const q = `文字列__1行_ = "${currentMonth}" order by レコード番号 asc limit 1`;
  // URLSearchParamsは空白を+にエンコードしkintoneがCB_IL02エラーを返すため手動組立
  const paramStr = `subdomain=white&app=${APP_NABON}&query=${encodeURIComponent(q)}`;
  const res = await fetch(`${PROXY}/kintone/v1/records.json?${paramStr}`, {
    headers: { 'X-Cybozu-API-Token': TOKEN_NABON }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(`kintone取得エラー: ${JSON.stringify(data).slice(0, 200)}`);
  if (!data.records?.length) throw new Error('レコードが見つかりません');
  const recId = data.records[0]['$id'].value;
  const raw = data.records[0]['文字列__複数行__0']?.value || '';
  let state;
  try { state = JSON.parse(raw); } catch(e) { state = { assignments:{}, returned:[], updatedAt:'' }; }

  if (!state.returned) state.returned = [];
  if (!state.returned.includes(currentWorker)) state.returned.push(currentWorker);
  delete state.assignments[currentWorker];

  // 受付停止フラグを設定/解除
  if (!state.paused) state.paused = {};
  if (withPause) {
    state.paused[currentWorker] = true;
  }
  state.updatedAt = new Date().toISOString();

  const putRes = await fetch(`${PROXY}/kintone/v1/record.json?subdomain=white`, {
    method: 'PUT',
    headers: { 'X-Cybozu-API-Token': TOKEN_NABON, 'Content-Type': 'application/json' },
    body: JSON.stringify({ app: APP_NABON, id: recId, record: {
      '文字列__複数行__0': { value: JSON.stringify(state, null, 2) }
    }})
  });
  if (!putRes.ok) {
    const errData = await putRes.text();
    throw new Error(`kintone更新エラー: ${errData.slice(0, 200)}`);
  }

  // UI を即時更新
  if (withPause) updatePauseUI(true);
}

function showWaitingScreen() {
  document.getElementById('work-screen').style.display = 'none';
  document.getElementById('return-footer').style.display = 'none';
  document.getElementById('waiting-screen').style.display = 'block';
  // 受付停止状態を初期表示
  getAssignState().then(state => {
    const isPaused = (state.paused || {})[currentWorker] === true;
    updatePauseUI(isPaused);
  }).catch(() => {});
  // 割当をポーリング
  pollAssignment();
}

let pollTimer = null;
async function pollAssignment() {
  // 戻り処理中はスキップ（レース条件回避）
  if (isReturning) {
    pollTimer = setTimeout(pollAssignment, 2000);
    return;
  }
  try {
    const state = await getAssignState();

    // 運転手の位置情報を表示
    if (state.driverLocation) {
      const loc = state.driverLocation;
      const locArea = document.getElementById('driver-location-area');
      const locLink = document.getElementById('driver-location-link');
      const locTime = document.getElementById('driver-location-time');
      if (locArea && locLink) {
        locArea.style.display = 'block';
        locLink.href = loc.url;
        if (locTime && loc.updatedAt) {
          const t = new Date(loc.updatedAt).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
          locTime.textContent = `${t} 時点の位置`;
        }
      }
    }

    const myGroupRaw = state.assignments[currentWorker];
    const myGroups = Array.isArray(myGroupRaw) ? myGroupRaw : (myGroupRaw ? [myGroupRaw] : []);
    if (myGroups.length > 0) {
      clearTimeout(pollTimer);
      document.getElementById('waiting-group').textContent = myGroups.join(' + ').toUpperCase();
      document.getElementById('waiting-screen').style.display = 'none';
      await loadGroup(myGroups);
      return;
    }
  } catch(e) { console.error(e); }
  pollTimer = setTimeout(pollAssignment, 5000);
}

async function loadGroup(groupCodes) {
  // 配列でも単一でも受付（後方互換）
  const groups = Array.isArray(groupCodes) ? groupCodes : [groupCodes];
  const groupLabel = groups.join(' + ').toUpperCase();
  document.getElementById('loading-screen').style.display = 'block';
  document.getElementById('loading-text').textContent = `グループ ${groupLabel} を読み込み中...`;
  try {
    // 1. グループコードに直接マッチするレコードを取得（複数グループ対応）
    const groupClause = groups.map(g => `"${g}"`).join(',');
    const query = `文字列__1行_ = "${currentMonth}" and 文字列__1行__0 in (${groupClause}) order by 文字列__1行__4 asc, 数値_1 asc limit 500`;
    let groupRecords = await kintoneGet(APP_NABON, TOKEN_NABON, query);

    // 2. revisitMap にあるレコードも取得（不在再訪・個別訪問・統合）
    const state = await getAssignState();
    const revisitIds = [];
    for (const g of groups) {
      const ids = (state.revisitMap?.[g] || []).map(String);
      revisitIds.push(...ids);
    }
    const uniqueRevisitIds = [...new Set(revisitIds)];
    if (uniqueRevisitIds.length > 0) {
      const idsClause = uniqueRevisitIds.map(id => `"${id}"`).join(',');
      const revisitQuery = `$id in (${idsClause})`;
      const revisitRecords = await kintoneGet(APP_NABON, TOKEN_NABON, revisitQuery);
      // 重複除外してマージ
      const existingIds = new Set(groupRecords.map(r => r['$id'].value));
      revisitRecords.forEach(r => {
        if (!existingIds.has(r['$id'].value)) groupRecords.push(r);
      });
    }

    records = groupRecords;
    doneCount = 0; absentCount = 0; todoCount = 0;
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('work-screen').style.display = 'block';
    document.getElementById('return-footer').style.display = 'block';
    saveSession();
    renderCards();
  } catch(e) {
    document.getElementById('loading-screen').style.display = 'none';
    alert('読み込みエラー: ' + e.message);
    document.getElementById('waiting-screen').style.display = 'block';
    pollTimer = setTimeout(pollAssignment, 5000);
  }
}

// ===== 手動更新 =====
async function refreshNow() {
  const btns = document.querySelectorAll('[onclick*="refreshNow"]');
  // 元のテキストを保存して⏳に変更
  const originalTexts = [];
  btns.forEach(b => {
    originalTexts.push(b.innerHTML);
    b.disabled = true;
    if (b.innerHTML.includes('🔄')) {
      b.innerHTML = b.innerHTML.replace('🔄', '⏳');
    }
  });

  try {
    // 待機画面・作業画面に関わらず、まず割当状態を確認
    const state = await getAssignState();
    const myGroupRaw = state.assignments?.[currentWorker];
    const myGroups = Array.isArray(myGroupRaw) ? myGroupRaw : (myGroupRaw ? [myGroupRaw] : []);

    if (document.getElementById('waiting-screen').style.display !== 'none') {
      // 待機画面：割当が来てれば作業画面に遷移
      clearTimeout(pollTimer);
      await pollAssignment();
    } else if (document.getElementById('work-screen').style.display !== 'none') {
      // 作業画面：割当が変わっていれば新しいグループ読込、同じなら現在グループのデータ再取得
      if (myGroups.length > 0) {
        await loadGroup(myGroups);
      } else {
        // 割当が外された場合、待機画面へ
        showWaitingScreen();
      }
    }
    // 成功表示
    btns.forEach((b, i) => {
      b.innerHTML = originalTexts[i].replace('🔄', '✅');
      setTimeout(() => { b.innerHTML = originalTexts[i]; }, 1200);
    });
  } catch(e) {
    console.error('更新エラー:', e);
    btns.forEach((b, i) => {
      b.innerHTML = originalTexts[i].replace('🔄', '❌');
      setTimeout(() => { b.innerHTML = originalTexts[i]; }, 1500);
    });
    alert('更新に失敗しました: ' + e.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

// ===== 受付停止トグル =====
async function togglePause() {
  const btn = document.getElementById('pause-toggle');
  btn.disabled = true;
  try {
    const state = await getAssignState();
    if (!state.paused) state.paused = {};
    const isPaused = state.paused[currentWorker] === true;
    if (isPaused) {
      delete state.paused[currentWorker];
    } else {
      state.paused[currentWorker] = true;
    }
    state.updatedAt = new Date().toISOString();
    await saveAssignState(state);
    updatePauseUI(!isPaused);
  } catch(e) {
    alert('更新エラー: ' + e.message);
  }
  btn.disabled = false;
}

function updatePauseUI(isPaused) {
  const btn = document.getElementById('pause-toggle');
  const msg = document.getElementById('waiting-msg');
  const spinner = document.getElementById('waiting-spinner-wrap');
  if (!btn) return;
  if (isPaused) {
    btn.innerHTML = '▶️ 受付を再開する';
    btn.style.background = '#d42020';
    btn.style.color = '#fff';
    btn.style.borderColor = '#d42020';
    if (msg) msg.innerHTML = '<strong style="color:#d42020">受付停止中です</strong><br>準備ができたら下のボタンで再開してください';
    if (spinner) spinner.style.display = 'none';
  } else {
    btn.innerHTML = '⏸️ 受付を一時停止する';
    btn.style.background = '#f5f5f0';
    btn.style.color = '#1a1a1a';
    btn.style.borderColor = 'var(--border)';
    if (msg) msg.innerHTML = '戻りを報告しました。<br>運転手が次のグループを割り当て中です...';
    if (spinner) spinner.style.display = 'flex';
  }
}

// ===== 起動 =====
init();
</script>
