<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8; --card:#fff; --ink:#1a1a1a; --muted:#888;
  --border:#e0dbd0; --blue:#1a5cd4; --green:#1a8a4a; --amber:#c47a0a; --red:#d42020;
  --car1:#e6f4fb; --car2:#fdeef2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);}

.app-header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.app-title{font-size:15px;font-weight:900;flex:1;}
.month-sel{font-size:11px;background:#333;color:#fff;border:none;padding:5px 10px;
  border-radius:20px;font-family:inherit;font-weight:700;}
.icon-btn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:5px 10px;
  border-radius:6px;font-size:13px;cursor:pointer;}
.tabs{display:flex;background:var(--ink);border-top:1px solid #333;}
.tab{padding:10px 16px;font-size:12px;font-weight:700;color:#888;cursor:pointer;
  border-bottom:3px solid transparent;}
.tab.active{color:#fff;border-bottom-color:var(--amber);}

.container{padding:16px;max-width:1100px;margin:0 auto;}
.screen{display:none;} .screen.active{display:block;}

.section{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);}
.section-title{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;margin-bottom:4px;}
.section-note{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;}
th{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.06em;
  background:#faf8f4;text-align:right;white-space:nowrap;}
th:first-child,td:first-child{text-align:left;}
td.mono{font-family:'DM Mono',monospace;}
tr.total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:900;background:#faf8f4;}
tr.osoi td:first-child{color:var(--amber);}
tr.zero td{color:#bbb;}

.loading{display:flex;flex-direction:column;align-items:center;padding:60px 0;gap:14px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--ink);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#fdecec;border:1px solid #f0b0b0;color:#a01818;border-radius:10px;
  padding:12px 14px;font-size:12px;line-height:1.8;}
.note{background:#fff8e8;border:1px solid #f0d090;border-radius:10px;padding:11px 14px;
  font-size:11px;color:#7a5a00;line-height:1.8;}
.kpi-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);}
.kpi-row b{font-family:'DM Mono',monospace;font-size:17px;color:var(--ink);}

/* ===== 配置 ===== */
.daytabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.daytab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.daytab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

input[type=text],input[type=number],select,textarea{padding:7px 9px;font-size:13px;font-family:inherit;
  border:1px solid var(--border);border-radius:7px;background:#fafafa;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
.btn{padding:10px 18px;font-size:13px;font-weight:900;font-family:inherit;color:#fff;
  background:var(--ink);border:none;border-radius:8px;cursor:pointer;}
.btn:disabled{background:#bbb;cursor:default;}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:24px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:12px;background:#eef1f5;border:1px solid var(--border);}
.chip.freec{background:#fdeef2;} .chip.annai{background:#eaf3e8;}
.chip b{font-weight:700;}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:13px;
  line-height:1;padding:0;}

.grid{display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;}
.grid .hd{font-size:11px;font-weight:900;color:var(--muted);display:flex;align-items:center;
  justify-content:center;}
.cell{border:1px solid var(--border);border-radius:10px;padding:10px;}
.cell.c1{background:var(--car1);} .cell.c2{background:var(--car2);}
.cell .lbl{font-size:10px;font-weight:900;color:var(--muted);margin:8px 0 3px;}
.cell .sum{font-family:'DM Mono',monospace;font-size:12.5px;margin-top:8px;
  padding-top:8px;border-top:1px dashed var(--border);line-height:1.7;}
.timelbl{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;background:#faf8f4;border-radius:10px;text-align:center;}

.routepick{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.rt{padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:#fff;
  font-size:11px;cursor:pointer;font-family:inherit;}
.rt.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.rt.rest{border-style:dashed;}
.rt.dup{box-shadow:0 0 0 2px #f0b0b0;}

.savebar{position:sticky;bottom:0;background:rgba(244,240,232,.96);padding:12px 0;
  display:flex;gap:10px;align-items:center;border-top:1px solid var(--border);}
.savemsg{font-size:12px;color:var(--muted);}

/* ===== 印刷レイアウト（A4ヨコ・2日を左右に） ===== */
.psheet{width:281mm;height:194mm;background:#fff;margin:0 auto 20px;
  box-shadow:0 2px 14px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:2mm;
  font-size:9pt;color:#000;overflow:hidden;}
.pdays{flex:1 1 auto;display:flex;gap:3mm;min-height:0;}
.pday{flex:1 1 0;display:flex;flex-direction:column;min-width:0;min-height:0;}
.ph{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid #000;
  padding-bottom:2px;margin-bottom:2px;flex:0 0 auto;}
.ph .t{font-size:13pt;font-weight:900;letter-spacing:.04em;}
.ph .d{font-size:8pt;font-weight:900;background:#000;color:#fff;padding:0 5px;border-radius:3px;}
.ph .r{margin-left:auto;font-size:7.5pt;color:#333;white-space:nowrap;}
.proster{display:flex;flex-direction:column;gap:1mm;font-size:7pt;margin-bottom:2px;flex:0 0 auto;}
.proster .b{border:1px solid #000;padding:1px 4px;line-height:1.4;}
.proster .b i{font-style:normal;font-weight:900;background:#eee;padding:0 3px;margin-right:3px;}
/* 見出し行は文字ぶんだけ、時間帯の3行で残りを等分する */
.pgrid{flex:1 1 auto;display:grid;grid-template-columns:12mm 1fr 1fr;
  grid-template-rows:auto repeat(3, minmax(0,1fr));gap:1mm;min-height:0;}
.pgrid .gh{font-size:7pt;font-weight:900;text-align:center;}
.pt{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:7.5pt;font-weight:900;border:1px solid #000;background:#f2f2f2;
  text-align:center;line-height:1.2;}
.pc{border:1px solid #000;padding:2px 4px;display:flex;flex-direction:column;
  min-height:0;overflow:hidden;}
.pc.c1{background:#eaf5fb;} .pc.c2{background:#fdeef3;}
.pc .who{flex:1 1 auto;min-height:0;overflow:hidden;line-height:1.35;font-size:7.5pt;}
.pc .who b{font-size:8.5pt;}
.pc .who .ann{font-size:6pt;font-weight:900;background:#444;color:#fff;border-radius:2px;padding:0 2px;margin-left:1px;vertical-align:2px;}
.pc .rt{flex:0 0 auto;font-size:7pt;line-height:1.45;}
.pc .rt span{display:inline-block;border:1px solid #666;border-radius:3px;
  padding:0 3px;margin:0 2px 1px 0;background:#fff;}
.pc .load{flex:0 0 auto;margin-top:2px;padding-top:2px;border-top:1px dashed #666;
  font-size:8pt;font-weight:900;white-space:nowrap;}
.pc .load small{font-weight:400;font-size:6.5pt;}
.pfoot{flex:0 0 auto;display:flex;gap:4px;font-size:7pt;}
.pfoot .box{border:1px solid #000;padding:2px 5px;line-height:1.45;}
.pfoot .memo{flex:1;white-space:pre-wrap;}
.ptable{width:100%;border-collapse:collapse;font-size:8pt;}
.ptable th,.ptable td{border:1px solid #000;padding:2px 5px;text-align:right;}
.ptable th{background:#eee;font-weight:900;}
.ptable th:first-child,.ptable td:first-child{text-align:left;}

@media print{
  .app-header,.tabs,.savebar,.noprint{display:none !important;}
  body{background:#fff;}
  .container{max-width:none;padding:0;}
  #screen-need,#screen-plan{display:none !important;}
  #screen-print{display:block !important;}
  .psheet{box-shadow:none;margin:0;break-after:page;}
  .psheet:last-child{break-after:auto;}
  @page{size:A4 landscape;margin:8mm;}
}
</style>
</head>
<body>

<div class="app-header">
  <a href="index.html" style="color:#fff;text-decoration:none;font-size:18px;">←</a>
  <div class="app-title">🚐 シフト表</div>
  <button class="icon-btn" onclick="loadData()" title="最新データを取得">🔄</button>
  <select class="month-sel" id="month-sel" onchange="loadData()" title="どの号の作業かを選びます"></select>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('need',this)">📦 必要数</div>
  <div class="tab" onclick="switchTab('plan',this)">👥 配置</div>
  <div class="tab" onclick="switchTab('print',this)">🖨 印刷</div>
</div>

<div class="container">
  <div class="screen active" id="screen-need"><div class="loading"><div class="spinner"></div></div></div>
  <div class="screen" id="screen-plan"></div>
  <div class="screen" id="screen-print"></div>
</div>

<script>
const PROXY  = KINTONE_CONFIG.PROXY;
const DOMAIN = KINTONE_CONFIG.DOMAIN;
const APP    = 269;

// 束の数え方（実際のシフト表の数値から確認したルール）
//   FreeC … 1束25冊。ルートごとに束ねてから合計する
//   MAP   … 1束50冊。冊数を合計してから束ねる
const FREEC_PER_BUNDLE = 25;
const MAP_PER_BUNDLE   = 50;
const TIMES = ['13:00〜', '15:30〜', '18:00〜'];
const CARS  = ['1号車', '2号車'];
const DAYS  = 4;

const F = {
  month:  '文字列__1行_',
  route:  '文字列__1行__4',
  nabon:  '数値',
  map:    '数値_3',
  osoi:   'チェックボックス_0',
  status: 'ドロップダウン',
  body:   '文字列__複数行__0',
};

let currentMonth = '';
let records = [];
let routeAgg = [];
let shift = null;
let memberPool = [];
let activeDay = 0;
let dirty = false;

const val = (r,k) => (r[k]?.value ?? '').toString().trim();
const num = (r,k) => parseFloat(r[k]?.value) || 0;
const isOsoi = r => ((r[F.osoi]?.value) || []).length > 0;
const bFreeC = n => Math.ceil(n / FREEC_PER_BUNDLE);
const bMap   = n => Math.ceil(n / MAP_PER_BUNDLE);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q = s => JSON.stringify(String(s)).replace(/"/g, '&quot;');
const monthSuffix = m => { const x = (m||'').match(/(\d{4})年(\d{1,2})月号/); return x ? `_${x[1]}_${x[2]}` : ''; };
const shiftKey  = m => `__shift__${monthSuffix(m)}`;
const commonKey = m => `__common__${monthSuffix(m)}`;

/* ===== 通信 ===== */
async function kget(query) {
  const res = await fetch(`${PROXY}/k/v1/records.json?app=${APP}&query=${encodeURIComponent(query)}&subdomain=${DOMAIN}`, {
    headers: { 'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON }
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `取得に失敗しました（${res.status}）`);
  }
  return (await res.json()).records || [];
}

async function fetchMonth(month) {
  const out = [];
  let offset = 0;
  while (true) {
    const batch = await kget(`${F.month} = "${month}" limit 500 offset ${offset}`);
    out.push(...batch);
    if (batch.length < 500) break;
    offset += 500;
    if (offset > 20000) break;
  }
  return out;
}

async function loadShiftRec(month) {
  const rows = await kget(`${F.month} = "${shiftKey(month)}" limit 1`);
  if (!rows.length) return null;
  let data = {};
  try { data = JSON.parse(val(rows[0], F.body) || '{}'); } catch (e) {}
  return { id: rows[0].$id.value, data };
}

async function loadMembers(month) {
  try {
    const rows = await kget(`${F.month} = "${commonKey(month)}" limit 1`);
    if (!rows.length) return [];
    const o = JSON.parse(val(rows[0], F.body) || '{}');
    return Array.isArray(o.members) ? o.members : [];
  } catch (e) { return []; }
}

async function saveShift() {
  const btn = document.getElementById('save-btn');
  const msg = document.getElementById('save-msg');
  btn.disabled = true; msg.textContent = '保存中…';
  try {
    shift.updatedAt = new Date().toISOString();
    const body = { value: JSON.stringify(shift, null, 2) };
    const existing = await loadShiftRec(currentMonth);
    const opt = m => ({ method:m, headers:{ 'Content-Type':'application/json',
      'X-Cybozu-API-Token': KINTONE_CONFIG.TOKEN_NOHON } });
    let res;
    if (existing) {
      res = await fetch(`${PROXY}/k/v1/record.json?subdomain=${DOMAIN}`, Object.assign(opt('PUT'), {
        body: JSON.stringify({ app: APP, id: existing.id, record: { [F.body]: body } }) }));
    } else {
      res = await fetch(`${PROXY}/k/v1/record.json?subdomain=${DOMAIN}`, Object.assign(opt('POST'), {
        body: JSON.stringify({ app: APP, record: {
          [F.month]: { value: shiftKey(currentMonth) }, [F.body]: body } }) }));
    }
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).message || '保存に失敗しました');
    dirty = false;
    msg.textContent = '保存しました（' + new Date().toLocaleTimeString('ja-JP') + '）';
  } catch (e) {
    msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

/* ===== 集計 ===== */
function aggregate() {
  const m = {};
  records.forEach(r => {
    const route = val(r, F.route);
    if (!route) return;
    const k = route + (isOsoi(r) ? '遅' : '');
    if (!m[k]) m[k] = { key:k, base:route, osoi:isOsoi(r), nabon:0, map:0,
                        rest:0, restMap:0, stores:0, restStores:0 };
    const d = m[k];
    d.stores++; d.nabon += num(r, F.nabon); d.map += num(r, F.map);
    if (val(r, F.status) !== '完了') { d.restStores++; d.rest += num(r, F.nabon); d.restMap += num(r, F.map); }
  });
  routeAgg = Object.values(m).sort((a,b) =>
    a.base !== b.base ? a.base.localeCompare(b.base,'ja') : (a.osoi ? 1 : -1));
}

// ルート指定（"A" / "A残り" / "案内所"）から冊数を引く
function tokenAmount(tok) {
  if (tok === '案内所') return { nabon:0, map:0, manual:true };
  if (tok.endsWith('残り')) {
    const d = routeAgg.find(x => x.key === tok.slice(0, -2));
    return d ? { nabon:d.rest, map:d.restMap } : { nabon:0, map:0 };
  }
  const d = routeAgg.find(x => x.key === tok);
  return d ? { nabon:d.nabon, map:d.map } : { nabon:0, map:0 };
}

function carTotals(routes) {
  let fb = 0, fc = 0, mc = 0, manual = false;
  (routes || []).forEach(t => {
    const a = tokenAmount(t);
    if (a.manual) { manual = true; return; }
    fb += bFreeC(a.nabon); fc += a.nabon; mc += a.map;
  });
  return { fb, fc, mb: bMap(mc), mc, manual };
}

/* ===== 配置データ ===== */
function blankShift() {
  return {
    days: Array.from({length:DAYS}, () => ({
      date: '', bento: '',
      roster: { freec: [], annai: [] },
      sections: TIMES.map(() => ({ cars: CARS.map(() => ({ sup:'', members:[], routes:[] })) }))
    })),
    startPoints: {}, annaiNote: '', updatedAt: ''
  };
}

function normalizeShift(o) {
  const base = blankShift();
  if (!o || typeof o !== 'object') return base;
  base.startPoints = o.startPoints || {};
  base.annaiNote = o.annaiNote || '';
  base.updatedAt = o.updatedAt || '';
  (o.days || []).slice(0, DAYS).forEach((d, i) => {
    const t = base.days[i];
    t.date = d.date || ''; t.bento = d.bento ?? '';
    t.roster.freec = (d.roster && d.roster.freec) || [];
    t.roster.annai = (d.roster && d.roster.annai) || [];
    (d.sections || []).slice(0, TIMES.length).forEach((s, si) => {
      (s.cars || []).slice(0, CARS.length).forEach((c, ci) => {
        const tc = t.sections[si].cars[ci];
        tc.sup = c.sup || ''; tc.members = c.members || []; tc.routes = c.routes || [];
      });
    });
  });
  return base;
}

/* ===== 起動・読み込み ===== */
function initMonthSel() {
  const sel = document.getElementById('month-sel');
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth() + 3;
  const months = [];
  while (y > 2020 || (y === 2020 && m >= 12)) {
    if (m <= 0) { m += 12; y--; continue; }
    months.push(`${y}年${m}月号`); m--;
  }
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  currentMonth = `${next.getFullYear()}年${next.getMonth()+1}月号`;
  sel.innerHTML = months.map(l =>
    `<option value="${esc(l)}"${l === currentMonth ? ' selected' : ''}>${esc(l)} 作業</option>`).join('');
}

async function loadData() {
  const sel = document.getElementById('month-sel');
  if (dirty && !confirm('保存していない配置があります。破棄して切り替えますか？')) {
    sel.value = currentMonth; return;
  }
  currentMonth = sel.value;
  dirty = false;
  document.getElementById('screen-need').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('screen-plan').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    records = await fetchMonth(currentMonth);
    aggregate();
    const [sh, mem] = await Promise.all([loadShiftRec(currentMonth), loadMembers(currentMonth)]);
    shift = normalizeShift(sh ? sh.data : null);
    memberPool = mem;
    renderNeed();
    renderPlan();
  } catch (e) {
    document.getElementById('screen-need').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    document.getElementById('screen-plan').innerHTML = '';
  }
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'print') renderPrint();
}

/* ===== 必要数タブ ===== */
function renderNeed() {
  if (!records.length) {
    document.getElementById('screen-need').innerHTML =
      `<div class="note">${esc(currentMonth)}のデータがありません。月次納本データ作成ツールで作成してください。</div>`;
    return;
  }
  const totalNabon = routeAgg.reduce((s,d) => s + d.nabon, 0);
  const totalMap   = routeAgg.reduce((s,d) => s + d.map, 0);
  const totalB     = routeAgg.reduce((s,d) => s + bFreeC(d.nabon), 0);
  const totalRest  = routeAgg.reduce((s,d) => s + d.rest, 0);
  const restStores = routeAgg.reduce((s,d) => s + d.restStores, 0);
  const doneAny    = records.some(r => val(r, F.status) === '完了');

  document.getElementById('screen-need').innerHTML = `
    <div class="section">
      <div class="section-title">ルート別 必要数</div>
      <div class="section-note">
        車に積む束数です。FreeC は 1束 ${FREEC_PER_BUNDLE}冊 でルートごとに束ね、
        MAP は 1束 ${MAP_PER_BUNDLE}冊 で合計してから束ねます。
      </div>
      <table>
        <thead><tr><th>ルート</th><th>店舗</th><th>束数</th><th>冊数</th><th>MAP冊数</th></tr></thead>
        <tbody>
          ${routeAgg.map(d => `<tr class="${d.osoi?'osoi':''} ${d.nabon===0?'zero':''}">
            <td><strong>${esc(d.key)}</strong></td>
            <td class="mono">${d.stores}</td>
            <td class="mono"><strong>${bFreeC(d.nabon)}</strong></td>
            <td class="mono">${d.nabon.toLocaleString()}</td>
            <td class="mono">${d.map.toLocaleString()}</td></tr>`).join('')}
          <tr class="total"><td>合計</td>
            <td class="mono">${records.length.toLocaleString()}</td>
            <td class="mono">${totalB.toLocaleString()}</td>
            <td class="mono">${totalNabon.toLocaleString()}</td>
            <td class="mono">${totalMap.toLocaleString()}</td></tr>
        </tbody>
      </table>
      <div class="kpi-row">
        <span>FreeC <b>${totalB.toLocaleString()}</b> 束 / <b>${totalNabon.toLocaleString()}</b> 冊</span>
        <span>MAP <b>${bMap(totalMap).toLocaleString()}</b> 束 / <b>${totalMap.toLocaleString()}</b> 冊</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">残り（未完了ぶん）</div>
      <div class="section-note">
        不在・未着手の店舗を集計したものです。シフト表の「A残り」などにあたり、作業が進むと減ります。<br>
        <strong>${restStores.toLocaleString()}店舗 / ${totalRest.toLocaleString()}冊</strong>が未完了です。
      </div>
      ${!doneAny ? `<div class="note">まだ1店舗も完了していないため、全ルートがそのまま残りとして出ます。作業開始後にご覧ください。</div>` : `
      <table>
        <thead><tr><th>ルート</th><th>残り店舗</th><th>残り束数</th><th>残り冊数</th><th>MAP冊数</th></tr></thead>
        <tbody>
          ${routeAgg.filter(d => d.restStores > 0).map(d => `<tr class="${d.osoi?'osoi':''}">
            <td><strong>${esc(d.key)}残り</strong></td>
            <td class="mono">${d.restStores}</td>
            <td class="mono"><strong>${bFreeC(d.rest)}</strong></td>
            <td class="mono">${d.rest.toLocaleString()}</td>
            <td class="mono">${d.restMap.toLocaleString()}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}

/* ===== 配置タブ ===== */
function renderPlan() {
  const el = document.getElementById('screen-plan');
  if (!records.length) { el.innerHTML = `<div class="note">先に月次納本データを作成してください。</div>`; return; }
  const d = shift.days[activeDay];

  el.innerHTML = `
    <div class="daytabs noprint">
      ${shift.days.map((x,i) => `<button class="daytab ${i===activeDay?'active':''}" onclick="setDay(${i})">
        ${i+1}日目${x.date ? '（' + esc(x.date) + '）' : ''}</button>`).join('')}
    </div>

    <div class="section">
      <div class="section-title">${activeDay+1}日目</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;">
        <label style="font-size:11px;font-weight:700;color:var(--muted)">日付<br>
          <input type="text" value="${esc(d.date)}" placeholder="8/18" style="width:110px"
                 oninput="setDate(this.value)"></label>
        <label style="font-size:11px;font-weight:700;color:var(--muted)">弁当<br>
          <input type="number" value="${esc(d.bento)}" style="width:80px" min="0"
                 oninput="setBento(this.value)"></label>
      </div>

      <div class="section-title">この日に入れる人</div>
      <div class="section-note">名前を入れて Enter。ここに入れた人だけが下の配置で選べます。</div>
      ${rosterBox('freec','FreeC', d.roster.freec)}
      ${rosterBox('annai','案内所', d.roster.annai)}
    </div>

    <div class="section">
      <div class="section-title">配置</div>
      <div class="section-note">ルートを選ぶと積む束数が自動で出ます。赤枠は同じ時間帯で両方の号車が選んでいるルートです。</div>
      <div class="grid">
        <div class="hd"></div><div class="hd">1号車</div><div class="hd">2号車</div>
        ${TIMES.map((t,si) => `
          <div class="timelbl">${t}${si===1?'':'<span style="font-weight:400;color:var(--muted);font-size:10px">目安</span>'}</div>
          ${CARS.map((_,ci) => carCell(si,ci)).join('')}`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">スタート地点</div>
      <div class="section-note">印刷したシフト表の下に載ります。一度入れれば翌月以降も引き継げます。</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${baseRoutes().map(r => `<label style="font-size:11px;font-weight:700;color:var(--muted)">${esc(r)}<br>
          <input type="text" style="width:130px" value="${esc(shift.startPoints[r] || '')}"
                 placeholder="南3西1" oninput="setStart(${q(r)}, this.value)"></label>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">案内所 FreeC 交換 ほか（自由記入）</div>
      <textarea style="width:100%;min-height:70px;" oninput="setAnnai(this.value)"
        placeholder="案内所FreeC交換 66束&#10;日劇 4 → 駅前本店 12 → 6条 8 → 新宿 4 → WEST 4 …">${esc(shift.annaiNote)}</textarea>
    </div>

    <div class="savebar noprint">
      <button class="btn" id="save-btn" onclick="saveShift()">💾 保存</button>
      <button class="btn ghost" onclick="window.print()">🖨 印刷</button>
      <span class="savemsg" id="save-msg">${shift.updatedAt
        ? '最終保存 ' + esc(new Date(shift.updatedAt).toLocaleString('ja-JP')) : '未保存'}</span>
    </div>`;
}

function rosterBox(kind, label, list) {
  return `<div style="margin-bottom:10px;">
    <div style="font-size:11px;font-weight:900;color:var(--muted);margin-bottom:4px;">${label}</div>
    <input type="text" list="member-pool-${kind}" placeholder="名前を入力して Enter" style="width:220px"
           onkeydown="if(event.key==='Enter'){event.preventDefault();addRoster('${kind}',this.value);this.value='';}">
    <datalist id="member-pool-${kind}">${memberPool.map(m => `<option value="${esc(m)}">`).join('')}</datalist>
    <div class="chips">${list.map(n => `<span class="chip ${kind}"><b>${esc(n)}</b>
      <button onclick="delRoster('${kind}',${q(n)})">×</button></span>`).join('')}</div>
  </div>`;
}

function carCell(si, ci) {
  const d = shift.days[activeDay];
  const c = d.sections[si].cars[ci];
  const all = [...d.roster.freec, ...d.roster.annai];
  const other = d.sections[si].cars[1-ci];
  // 同じ時間帯ですでに配置済みの人は「＋追加」に出さない
  const taken = new Set([other.sup, ...other.members, c.sup, ...c.members].filter(Boolean));
  const pick = all.filter(n => !taken.has(n));
  const t = carTotals(c.routes);
  const otherRoutes = new Set(other.routes || []);

  const tokens = routeAgg.map(r => ({ tok:r.key, rest:false }))
    .concat(routeAgg.filter(r => r.restStores > 0).map(r => ({ tok:r.key + '残り', rest:true })))
    .concat([{ tok:'案内所', rest:false }]);

  return `<div class="cell c${ci+1}">
    <div class="lbl" style="margin-top:0">監督</div>
    <select onchange="setSup(${si},${ci},this.value)" style="width:100%">
      <option value="">（未定）</option>
      ${all.map(n => `<option value="${esc(n)}"${n===c.sup?' selected':''}>${esc(n)}</option>`).join('')}
    </select>

    <div class="lbl">メンバー（${c.members.length}人）</div>
    <select onchange="addMember(${si},${ci},this.value);this.value='';" style="width:100%">
      <option value="">＋ 追加</option>
      ${pick.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
    </select>
    <div class="chips">${c.members.map(n => `<span class="chip"><b>${esc(n)}</b>
      <button onclick="delMember(${si},${ci},${q(n)})">×</button></span>`).join('')}</div>

    <div class="lbl">ルート</div>
    <div class="routepick">
      ${tokens.map(x => `<button class="rt${c.routes.includes(x.tok)?' on':''}${x.rest?' rest':''}${
        (otherRoutes.has(x.tok) && c.routes.includes(x.tok))?' dup':''}"
        onclick="toggleRoute(${si},${ci},${q(x.tok)})">${esc(x.tok)}</button>`).join('')}
    </div>

    <div class="sum">
      人数 ${(c.sup ? 1 : 0) + c.members.length} 人<br>
      FreeC <strong>${t.fb}</strong> 束（${t.fc.toLocaleString()} 冊）<br>
      MAP <strong>${t.mb}</strong> 束（${t.mc.toLocaleString()} 冊）
      ${t.manual ? '<br><span style="color:var(--amber)">＋案内所（手集計）</span>' : ''}
    </div>
  </div>`;
}

/* ===== 印刷タブ（A4ヨコ・2日で1ページ＝両面1枚） ===== */
function dayHasContent(d) {
  if (d.date || d.roster.freec.length || d.roster.annai.length) return true;
  return d.sections.some(s => s.cars.some(c => c.sup || c.members.length || c.routes.length));
}

function renderPrint() {
  const el = document.getElementById('screen-print');
  if (!records.length) { el.innerHTML = `<div class="note">先に月次納本データを作成してください。</div>`; return; }

  const days = shift.days.map((d,i) => ({ d, i })).filter(x => dayHasContent(x.d));
  if (!days.length) {
    el.innerHTML = `<div class="note">まだ配置が入っていません。「👥 配置」タブで組んでから印刷してください。</div>`;
    return;
  }

  // 2日ずつ1ページに載せる
  const pages = [];
  for (let i = 0; i < days.length; i += 2) pages.push(days.slice(i, i + 2));
  const withNeed = document.getElementById('pn-need') ? document.getElementById('pn-need').checked : true;
  const total = pages.length + (withNeed ? 1 : 0);

  el.innerHTML = `
    <div class="note noprint">
      A4ヨコ・<strong>2日で1ページ</strong>で出ます（全${total}ページ）。
      両面印刷にすると${Math.ceil(total/2)}枚に収まります。<br>
      印刷ダイアログで用紙をA4・向きを横にし、「背景のグラフィック」を有効、余白は「なし」にしてください。
      <label style="display:inline-block;margin-top:6px;">
        <input type="checkbox" id="pn-need" ${withNeed ? 'checked' : ''} onchange="renderPrint()">
        ルート別必要数のページを付ける
      </label>
    </div>
    ${pages.map(printPage).join('')}
    ${withNeed ? printNeed() : ''}
    <div class="savebar noprint"><button class="btn" onclick="window.print()">🖨 印刷 / PDF保存</button></div>`;

  fitPrintCells();
}

/* 人数が多いマスは名前がはみ出す。束数の行が切れないよう、
   収まるまで名前だけ小さくする。 */
function fitPrintCells() {
  document.querySelectorAll('#screen-print .pc').forEach(cell => {
    const who = cell.querySelector('.who');
    if (!who) return;
    let pt = 7.5;
    who.style.fontSize = pt + 'pt';
    while (who.scrollHeight > who.clientHeight + 1 && pt > 5) {
      pt = Math.round((pt - 0.25) * 100) / 100;
      who.style.fontSize = pt + 'pt';
    }
  });
}

function printPage(pair) {
  const sp = baseRoutes().filter(r => shift.startPoints[r]);
  const foot = (sp.length || shift.annaiNote) ? `<div class="pfoot">
      ${sp.length ? `<div class="box"><b>スタート地点</b>　${
        sp.map(r => `${esc(r)}：${esc(shift.startPoints[r])}`).join('　')}</div>` : ''}
      ${shift.annaiNote ? `<div class="box memo">${esc(shift.annaiNote)}</div>` : ''}
    </div>` : '';
  // 元のシート同様、2日を左右に並べる
  return `<div class="psheet">
    <div class="pdays">${pair.map(x => printDay(x.d, x.i)).join('')}</div>
    ${foot}
  </div>`;
}

/* 名前の末尾に付けた「（案内所）」は印刷では外し、代わりに小さな印を付ける。
   同姓が FreeC と案内所の両方に居るため、印が無いと区別できなくなる。 */
function dispName(day, name) {
  const bare = String(name).replace(/[（(]\s*(案内所|案)\s*[）)]\s*$/, '').trim() || name;
  const isAnnai = (day.roster.annai || []).includes(name);
  return esc(bare) + (isAnnai ? '<span class="ann">案</span>' : '');
}

function printDay(d, idx) {
  const rosterHtml = (label, list) => list.length
    ? `<div class="b"><i>${label}</i>${list.map(esc).join('　')}</div>` : '';

  const cells = TIMES.map((t, si) => {
    const row = CARS.map((_, ci) => {
      const c = d.sections[si].cars[ci];
      const tt = carTotals(c.routes);
      const people = [c.sup ? `<b>${dispName(d, c.sup)}</b>` : '', ...c.members.map(n => dispName(d, n))]
        .filter(Boolean).join('　');
      return `<div class="pc c${ci+1}">
        <div class="who">${people || '<span style="color:#999">（未定）</span>'}</div>
        <div class="rt">${(c.routes || []).map(r => `<span>${esc(r)}</span>`).join('')}</div>
        <div class="load">
          FreeC ${tt.fb}束 <small>(${tt.fc.toLocaleString()}冊)</small>　
          MAP ${tt.mb}束 <small>(${tt.mc.toLocaleString()}冊)</small>
          ${tt.manual ? '　<small>＋案内所</small>' : ''}
          <small style="float:right">${(c.sup?1:0)+c.members.length}人</small>
        </div>
      </div>`;
    }).join('');
    const sub = si === 1 ? '' : '<span style="font-weight:400;font-size:6.5pt">目安</span>';
    return `<div class="pt">${esc(t)}${sub}</div>${row}`;
  }).join('');

  return `<div class="pday">
    <div class="ph">
      <div class="t">${esc(d.date || (idx+1) + '日目')}</div>
      <div class="d">${idx+1}日目</div>
      <div class="r">${esc(currentMonth)}${d.bento !== '' ? '　弁当 ' + esc(d.bento) + '個' : ''}</div>
    </div>
    <div class="proster">
      ${rosterHtml('FreeC', d.roster.freec)}
      ${rosterHtml('案内所', d.roster.annai)}
    </div>
    <div class="pgrid">
      <div class="gh"></div><div class="gh">1号車</div><div class="gh">2号車</div>
      ${cells}
    </div>
  </div>`;
}

function printNeed() {
  const rows = routeAgg.filter(d => d.stores > 0);
  const rest = routeAgg.filter(d => d.restStores > 0);
  const half = Math.ceil(rows.length / 2);
  const tbl = list => `<table class="ptable">
    <thead><tr><th>ルート</th><th>束数</th><th>冊数</th><th>MAP</th></tr></thead>
    <tbody>${list.map(d => `<tr><td><strong>${esc(d.key)}</strong></td>
      <td>${bFreeC(d.nabon)}</td><td>${d.nabon.toLocaleString()}</td>
      <td>${d.map.toLocaleString()}</td></tr>`).join('')}</tbody></table>`;

  return `<div class="psheet">
    <div class="ph">
      <div class="t">ルート別 必要数</div>
      <div class="r">${esc(currentMonth)}　FreeC 1束${FREEC_PER_BUNDLE}冊（ルートごとに束ねる）／ MAP 1束${MAP_PER_BUNDLE}冊（合計してから束ねる）</div>
    </div>
    <div style="display:flex;gap:6mm;flex:1;min-height:0;align-items:flex-start;">
      <div style="flex:1">${tbl(rows.slice(0, half))}</div>
      <div style="flex:1">${tbl(rows.slice(half))}</div>
      <div style="flex:1">
        ${rest.length ? `<div style="font-size:8pt;font-weight:900;margin-bottom:3px;">残り（不在・未着手ぶん）</div>
        <table class="ptable">
          <thead><tr><th>ルート</th><th>店</th><th>束数</th><th>冊数</th></tr></thead>
          <tbody>${rest.map(d => `<tr><td><strong>${esc(d.key)}残り</strong></td>
            <td>${d.restStores}</td><td>${bFreeC(d.rest)}</td>
            <td>${d.rest.toLocaleString()}</td></tr>`).join('')}</tbody>
        </table>` : ''}
      </div>
    </div>
  </div>`;
}

/* ===== 操作 ===== */
function touch() {
  dirty = true;
  const m = document.getElementById('save-msg');
  if (m) m.textContent = '未保存の変更があります';
}
function setDay(i)   { activeDay = i; renderPlan(); }
function setDate(v)  { shift.days[activeDay].date = v; touch(); }
function setBento(v) { shift.days[activeDay].bento = v; touch(); }
function setAnnai(v) { shift.annaiNote = v; touch(); }
function setStart(route, v) { shift.startPoints[route] = v; touch(); }
// 遅を除いた素のルート名（A, B, D …）
function baseRoutes() { return [...new Set(routeAgg.map(r => r.base))].sort((a,b) => a.localeCompare(b,'ja')); }

function addRoster(kind, name) {
  name = (name || '').trim();
  if (!name) return;
  const list = shift.days[activeDay].roster[kind];
  if (!list.includes(name)) list.push(name);
  touch(); renderPlan();
}
function delRoster(kind, name) {
  const d = shift.days[activeDay];
  d.roster[kind] = d.roster[kind].filter(n => n !== name);
  d.sections.forEach(s => s.cars.forEach(c => {
    if (c.sup === name) c.sup = '';
    c.members = c.members.filter(n => n !== name);
  }));
  touch(); renderPlan();
}
function setSup(si, ci, v) {
  shift.days[activeDay].sections[si].cars[ci].sup = v; touch(); renderPlan();
}
function addMember(si, ci, v) {
  if (!v) return;
  const c = shift.days[activeDay].sections[si].cars[ci];
  if (!c.members.includes(v)) c.members.push(v);
  touch(); renderPlan();
}
function delMember(si, ci, v) {
  const c = shift.days[activeDay].sections[si].cars[ci];
  c.members = c.members.filter(n => n !== v);
  touch(); renderPlan();
}
function toggleRoute(si, ci, tok) {
  const c = shift.days[activeDay].sections[si].cars[ci];
  c.routes = c.routes.includes(tok) ? c.routes.filter(t => t !== tok) : [...c.routes, tok];
  touch(); renderPlan();
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ===== 起動 ===== */
initMonthSel();
loadData();
</script>
