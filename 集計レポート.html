<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>集計・レポート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f0e8; --card:#fff; --ink:#1a1a1a; --muted:#888;
  --border:#e0dbd0; --green:#1a8a4a; --amber:#c47a0a;
  --blue:#1a5cd4; --red:#d42020;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px;}

.app-header{background:var(--ink);color:white;padding:14px 16px;}
.app-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.app-title{font-size:15px;font-weight:900;}
.month-sel{font-size:11px;background:#333;color:white;border:none;padding:4px 10px;border-radius:20px;font-family:'Noto Sans JP',sans-serif;font-weight:700;}

.tabs{display:flex;border-top:1px solid #333;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:11px 10px;text-align:center;font-size:11px;font-weight:700;color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
.tab.active{color:white;border-bottom-color:var(--amber);}

.container{padding:16px;max-width:700px;margin:0 auto;}

.screen{display:none;}
.screen.active{display:block;}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted);}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.kpi-card{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.kpi-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.kpi-card.green .kpi-val{color:var(--green);}
.kpi-card.amber .kpi-val{color:var(--amber);}
.kpi-card.blue .kpi-val{color:var(--blue);}
.kpi-card.red .kpi-val{color:var(--red);}

/* SECTION */
.section{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.section-title{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}

/* BAR CHART */
.bar-chart{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{font-size:11px;font-weight:700;width:60px;flex-shrink:0;text-align:right;}
.bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:22px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:4px;transition:width .8s ease;}
.bar-fill-text{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:white;white-space:nowrap;}
.bar-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);width:50px;flex-shrink:0;}

/* DONUT CHART */
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut-canvas-wrap{position:relative;flex-shrink:0;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-center-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;}
.donut-center-lbl{font-size:9px;color:var(--muted);}
.donut-legend{flex:1;}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-label{font-size:12px;flex:1;}
.legend-val{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);}

/* TREND CHART */
.trend-chart{position:relative;height:160px;margin-top:8px;}
.trend-canvas{width:100%;height:100%;}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;padding:8px 10px;background:var(--ink);color:white;font-size:10px;letter-spacing:.06em;font-weight:700;}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#f8f5f0;}
.mono{font-family:'DM Mono',monospace;}
.badge-done{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;background:#d4f5e2;color:var(--green);}
.badge-absent{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;background:#fef3d0;color:var(--amber);}
.badge-todo{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;background:#f0ede8;color:var(--muted);}

/* EXPORT BTN */
.export-btn{width:100%;padding:13px;background:var(--ink);color:white;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:900;cursor:pointer;margin-top:14px;}
.export-btn:active{transform:scale(.98);}

/* SUB TABS */
.sub-tabs{display:flex;gap:0;background:var(--bg);border-radius:10px;padding:3px;margin:12px 0 0;}
.sub-tab{flex:1;padding:9px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .2s;}
.sub-tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.sub-panel{display:none;}
.sub-panel.active{display:block;}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-top">
    <a href="index.html" style="color:#fff;text-decoration:none;font-size:18px;margin-right:6px;">←</a>
    <div class="app-title">📊 集計・レポート</div>
    <button onclick="forceReload()" title="最新データ取得（キャッシュクリア）" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer;margin-right:6px;">🔄</button>
    <select class="month-sel" id="month-sel" onchange="loadData()"></select>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('summary', this)">📈 サマリー</div>
    <div class="tab" onclick="switchTab('route', this)">🗺️ ルート別</div>
    <div class="tab" onclick="switchTab('worker', this)">👤 作業者別</div>
    <div class="tab" onclick="switchTab('absent', this)">🚫 不在一覧</div>
    <div class="tab" onclick="switchTab('detail', this)">📋 明細</div>
    <div class="tab" onclick="switchTab('prevmon', this)">📊 前月号消化</div>
    <div class="tab" onclick="switchTab('haifu', this)">📦 配布物</div>
    <div class="tab" onclick="switchTab('shouka', this)">🔥 消化分析</div>
  </div>
</div>

<!-- サマリー -->
<div class="screen active container" id="screen-summary">
  <div class="loading" id="loading-summary">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>
  <div id="summary-content" style="display:none">

    <div class="kpi-grid">
      <div class="kpi-card green">
        <div class="kpi-label">総納本数</div>
        <div class="kpi-val" id="kpi-nabon">0</div>
        <div class="kpi-sub">冊</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-label">総返却数</div>
        <div class="kpi-val" id="kpi-henkyaku">0</div>
        <div class="kpi-sub">冊（残部率 <span id="kpi-zanbu">0</span>%）</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">完了件数</div>
        <div class="kpi-val" id="kpi-done">0</div>
        <div class="kpi-sub" id="kpi-done-pct">/ 0件</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">不在件数</div>
        <div class="kpi-val" id="kpi-absent">0</div>
        <div class="kpi-sub" id="kpi-absent-pct">件</div>
      </div>
    </div>

    <!-- ステータス内訳 -->
    <div class="section">
      <div class="section-title">ステータス内訳</div>
      <div class="donut-wrap">
        <div class="donut-canvas-wrap">
          <canvas id="donut-canvas" width="120" height="120"></canvas>
          <div class="donut-center">
            <div class="donut-center-val" id="donut-center-val">0%</div>
            <div class="donut-center-lbl">完了率</div>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><div class="legend-label">完了</div><div class="legend-val" id="leg-done">0件</div></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div><div class="legend-label">不在</div><div class="legend-val" id="leg-absent">0件</div></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div><div class="legend-label">未着手</div><div class="legend-val" id="leg-todo">0件</div></div>
        </div>
      </div>
    </div>

    <!-- ルート別納本数 -->
    <div class="section">
      <div class="section-title">ルート別 納本数</div>
      <div class="bar-chart" id="route-bar-chart"></div>
    </div>

    <button class="export-btn" onclick="exportCSV()">⬇️ CSVエクスポート</button>
  </div>
</div>

<!-- ルート別 -->
<div class="screen container" id="screen-route">
  <div id="route-table-content"></div>
</div>

<!-- 作業者別 -->
<div class="screen container" id="screen-worker">
  <div id="worker-table-content"></div>
</div>

<!-- 明細 -->
<div class="screen container" id="screen-detail">
  <div style="overflow-x:auto">
    <table class="data-table" id="detail-table">
      <thead>
        <tr>
          <th>ルート</th>
          <th>店名</th>
          <th>ビル</th>
          <th>担当者</th>
          <th>納本</th>
          <th>返却</th>
          <th>ステータス</th>
        </tr>
      </thead>
      <tbody id="detail-tbody"></tbody>
    </table>
  </div>
</div>

<!-- 不在一覧 -->
<div class="screen container" id="screen-absent">
  <div id="absent-content"></div>
</div>

<!-- 前月号消化 -->
<div class="screen container" id="screen-prevmon">
  <div id="prevmon-content"></div>
</div>

<!-- 配布物 -->
<div class="screen container" id="screen-haifu">
  <div id="haifu-content"></div>
</div>

<!-- 消化分析 -->
<div class="screen container" id="screen-shouka">
  <div id="shouka-content"></div>
</div>

<script>
const PROXY = 'https://kintone-proxy.mmmm82mmmm.workers.dev';
const BASE = `${PROXY}/kintone/v1`;
const TOKEN = 'jQ9OU3Kp6CWMmeD1WnA32M6VPdxpt1e5La7gilcF';
const APP = 269;
const DOMAIN = 'white';

let allRecords = [];
let currentMonth = '';
let prevMonthRecords = [];
let prevMonthLabel = '';

// 前月のラベルを取得
function getPrevMonth(month) {
  const m = month.match(/(\d{4})年(\d{1,2})月号/);
  if (!m) return '';
  let y = parseInt(m[1]), mo = parseInt(m[2]) - 1;
  if (mo <= 0) { mo += 12; y--; }
  return `${y}年${mo}月号`;
}

// 月選択初期化（2020年12月〜現在+2ヶ月をプログラム生成）
async function initMonthSel() {
  const sel = document.getElementById('month-sel');
  const now = new Date();
  const endY = now.getFullYear(), endM = now.getMonth() + 3; // 2ヶ月先まで
  const startY = 2020, startM = 12;

  const months = [];
  let y = endY, m = endM;
  while (y > startY || (y === startY && m >= startM)) {
    if (m <= 0) { m += 12; y--; continue; }
    months.push(`${y}年${m}月号`);
    m--;
  }

  const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  currentMonth = `${nextMonth.getFullYear()}年${nextMonth.getMonth()+1}月号`;

  months.forEach(label => {
    const o = document.createElement('option');
    o.value = label; o.textContent = label;
    if (label === currentMonth) o.selected = true;
    sel.appendChild(o);
  });
}

let masterRecords = [];

// 強制リロード（キャッシュクリア）
function forceReload() {
  try { localStorage.removeItem('fp_master_full_cache'); } catch(e) {}
  masterRecords = [];
  loadData();
}

async function loadData() {
  currentMonth = document.getElementById('month-sel').value;
  document.getElementById('loading-summary').style.display = 'flex';
  document.getElementById('summary-content').style.display = 'none';

  try {
    // 納本データを全件取得（500件ずつ）
    allRecords = [];
    let offset = 0;
    while (true) {
      const q = encodeURIComponent(`文字列__1行_ = "${currentMonth}" order by 文字列__1行__4 asc, 数値_1 asc limit 500 offset ${offset}`);
      const res = await fetch(`${BASE}/records.json?app=${APP}&query=${q}&subdomain=${DOMAIN}`, {
        headers: { 'X-Cybozu-API-Token': TOKEN }
      });
      const data = await res.json();
      const batch = data.records || [];
      allRecords = allRecords.concat(batch);
      if (batch.length < 500) break;
      offset += 500;
    }

    // 設置店マスタ全件取得（必要フィールドのみ・localStorageキャッシュ1時間）
    if (masterRecords.length === 0) {
      const CACHE_KEY = 'fp_master_full_cache';
      const TTL = 60 * 60 * 1000; // 1時間
      let cached = null;
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const obj = JSON.parse(raw);
          if (Date.now() - obj.ts <= TTL) cached = obj.data;
        }
      } catch(e) {}

      if (cached) {
        masterRecords = cached;
        console.log(`📦 マスタキャッシュ使用: ${masterRecords.length}件`);
      } else {
        let offset = 0;
        // 集計に必要なフィールドのみ
        const masterFields = ['文字列__1行__0', '文字列__1行__1', '文字列__1行__7', '文字列__1行__8']
          .map(f => `&fields=${encodeURIComponent(f)}`).join('');
        while (true) {
          const mq = encodeURIComponent(`limit 500 offset ${offset}`);
          const mres = await fetch(`${BASE}/records.json?app=268&query=${mq}&subdomain=${DOMAIN}${masterFields}`, {
            headers: { 'X-Cybozu-API-Token': 'STw43jr9R6svTT6lIVPjITHQawcfHebdPtKqppkg' }
          });
          const mdata = await mres.json();
          const batch = mdata.records || [];
          masterRecords = masterRecords.concat(batch);
          if (batch.length < 500) break;
          offset += 500;
        }
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: masterRecords }));
        } catch(e) { console.warn('マスタキャッシュ保存失敗:', e); }
        console.log(`🌐 マスタ取得: ${masterRecords.length}件`);
      }
    }

    // 前月号データ取得（前月号消化タブ用）
    prevMonthLabel = getPrevMonth(currentMonth);
    prevMonthRecords = [];
    if (prevMonthLabel) {
      let offset = 0;
      while (true) {
        const pq = encodeURIComponent(`文字列__1行_ = "${prevMonthLabel}" order by 文字列__1行__4 asc, 数値_1 asc limit 500 offset ${offset}`);
        const pres = await fetch(`${BASE}/records.json?app=${APP}&query=${pq}&subdomain=${DOMAIN}`, {
          headers: { 'X-Cybozu-API-Token': TOKEN }
        });
        const pdata = await pres.json();
        const batch = pdata.records || [];
        prevMonthRecords = prevMonthRecords.concat(batch);
        if (batch.length < 500) break;
        offset += 500;
      }
    }

    renderSummary();
    renderRouteTable();
    renderWorkerTable();
    renderAbsent();
    renderDetailTable();
    renderPrevMonth();
    renderHaifu();
    renderShouka();

  } catch(e) {
    alert('データ取得エラー: ' + e.message);
  } finally {
    document.getElementById('loading-summary').style.display = 'none';
    document.getElementById('summary-content').style.display = 'block';
  }
}

function getVal(r, key) { return r[key]?.value || ''; }
function getNum(r, key) { return parseFloat(r[key]?.value) || 0; }

// 補充冊数合計（サブテーブル）
function getRefillTotal(r) {
  const table = r['テーブル_0']?.value || [];
  return table.reduce((s, row) => s + (parseFloat(row.value?.['数値_4']?.value) || 0), 0);
}
function getRefillCount(r) {
  return (r['テーブル_0']?.value || []).length;
}

function renderSummary() {
  const done = allRecords.filter(r => getVal(r,'ドロップダウン') === '完了');
  const absent = allRecords.filter(r => getVal(r,'ドロップダウン') === '不在');
  const todo = allRecords.filter(r => getVal(r,'ドロップダウン') === '未着手');
  const total = allRecords.length;

  const totalNabon = done.reduce((s,r) => s + getNum(r,'数値'), 0);
  const totalRefill = done.reduce((s,r) => s + getRefillTotal(r), 0);
  const totalHenkyaku = done.reduce((s,r) => s + getNum(r,'数値_0'), 0);
  const totalSupply = totalNabon + totalRefill;
  const zanbu = totalSupply > 0 ? Math.round(totalHenkyaku / totalSupply * 100) : 0;

  document.getElementById('kpi-nabon').textContent = totalNabon.toLocaleString();
  const nabonSub = document.querySelector('#kpi-nabon').parentElement.querySelector('.kpi-sub');
  nabonSub.innerHTML = totalRefill > 0 ? `冊 <span style="color:var(--green);font-weight:700;font-size:11px">+${totalRefill}補充</span>` : '冊';
  document.getElementById('kpi-henkyaku').textContent = totalHenkyaku.toLocaleString();
  document.getElementById('kpi-zanbu').textContent = zanbu;
  document.getElementById('kpi-done').textContent = done.length;
  document.getElementById('kpi-done-pct').textContent = `/ ${total}件 (${total>0?Math.round(done.length/total*100):0}%)`;
  document.getElementById('kpi-absent').textContent = absent.length;
  document.getElementById('kpi-absent-pct').textContent = `件 (${total>0?Math.round(absent.length/total*100):0}%)`;

  // ドーナツグラフ
  const pct = total > 0 ? Math.round(done.length / total * 100) : 0;
  document.getElementById('donut-center-val').textContent = pct + '%';
  document.getElementById('leg-done').textContent = done.length + '件';
  document.getElementById('leg-absent').textContent = absent.length + '件';
  document.getElementById('leg-todo').textContent = todo.length + '件';
  drawDonut(done.length, absent.length, todo.length);

  // ルート別棒グラフ（遅分離）
  const routeMap = {};
  allRecords.forEach(r => {
    const route = getRouteKey(r);
    if (!routeMap[route]) routeMap[route] = 0;
    routeMap[route] += getNum(r,'数値');
  });
  const sortedRouteKeys = Object.keys(routeMap).sort((a, b) => {
    const la = a.replace('遅',''), lb = b.replace('遅','');
    if (la !== lb) return la.localeCompare(lb);
    return a.includes('遅') ? 1 : -1;
  });
  const maxVal = Math.max(...Object.values(routeMap), 1);
  const barChart = document.getElementById('route-bar-chart');
  barChart.innerHTML = sortedRouteKeys.map(route => {
    const val = routeMap[route];
    const isOsoi = route.includes('遅');
    return `
    <div class="bar-row">
      <div class="bar-label" style="font-size:10px;${isOsoi ? 'color:var(--amber)' : ''}">${route}</div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${val/maxVal*100}%;background:${isOsoi ? 'var(--amber)' : 'var(--blue)'}">
          ${val > 0 ? `<span class="bar-fill-text">${val.toLocaleString()}</span>` : ''}
        </div>
      </div>
      <div class="bar-val">${val.toLocaleString()}冊</div>
    </div>`;
  }).join('');
}

function drawDonut(done, absent, todo) {
  const canvas = document.getElementById('donut-canvas');
  const ctx = canvas.getContext('2d');
  const total = done + absent + todo;
  if (total === 0) return;

  const cx = 60, cy = 60, r = 50, ir = 35;
  ctx.clearRect(0, 0, 120, 120);

  const segments = [
    { val: done, color: '#1a8a4a' },
    { val: absent, color: '#c47a0a' },
    { val: todo, color: '#e0dbd0' },
  ];

  let startAngle = -Math.PI / 2;
  segments.forEach(seg => {
    if (seg.val === 0) return;
    const angle = (seg.val / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + angle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    startAngle += angle;
  });

  // 内側を白くくり抜く
  ctx.beginPath();
  ctx.arc(cx, cy, ir, 0, Math.PI * 2);
  ctx.fillStyle = 'white';
  ctx.fill();
}

function getRouteKey(r) {
  // 遅フラグで分離（チェックボックス_0に値があれば「遅」扱い）
  const route = getVal(r,'文字列__1行__4') || '未設定';
  const isOsoi = (r['チェックボックス_0']?.value || []).length > 0;
  return isOsoi ? route + '遅' : route;
}

function renderRouteTable() {
  const routeMap = {};
  allRecords.forEach(r => {
    const route = getRouteKey(r);
    if (!routeMap[route]) routeMap[route] = { done:0, absent:0, todo:0, nabon:0, refill:0, henkyaku:0 };
    const s = getVal(r,'ドロップダウン');
    if (s === '完了') {
      routeMap[route].done++;
      routeMap[route].nabon += getNum(r,'数値');
      routeMap[route].refill += getRefillTotal(r);
      routeMap[route].henkyaku += getNum(r,'数値_0');
    }
    else if (s === '不在') routeMap[route].absent++;
    else routeMap[route].todo++;
  });

  // ルートを正しくソート（A→A遅→B→B遅...）
  const sortedRoutes = Object.keys(routeMap).sort((a, b) => {
    const la = a.replace('遅',''), lb = b.replace('遅','');
    if (la !== lb) return la.localeCompare(lb);
    return a.includes('遅') ? 1 : -1;
  });

  const rows = sortedRoutes.map(route => {
    const d = routeMap[route];
    const total = d.done + d.absent + d.todo;
    const pct = total > 0 ? Math.round(d.done/total*100) : 0;
    const isOsoi = route.includes('遅');
    return `<tr style="${isOsoi ? 'background:#fffbf0' : ''}">
      <td><strong>ルート${route}</strong>${isOsoi ? ' <span style="font-size:10px;color:var(--amber);font-weight:700;">遅</span>' : ''}</td>
      <td class="mono">${total}</td>
      <td class="mono" style="color:var(--green)">${d.done}</td>
      <td class="mono" style="color:var(--amber)">${d.absent}</td>
      <td class="mono" style="color:var(--muted)">${d.todo}</td>
      <td class="mono">${d.nabon.toLocaleString()}</td>
      <td class="mono" style="color:var(--green)">${d.refill > 0 ? '+'+d.refill : '-'}</td>
      <td class="mono">${d.henkyaku.toLocaleString()}</td>
      <td class="mono">${pct}%</td>
    </tr>`;
  }).join('');

  document.getElementById('route-table-content').innerHTML = `
    <div class="section" style="margin-top:16px;overflow-x:auto">
      <div class="section-title">ルート別集計（遅分離）</div>
      <table class="data-table">
        <thead><tr>
          <th>ルート</th><th>総件数</th><th>完了</th><th>不在</th><th>未着手</th><th>納本</th><th>補充</th><th>返却</th><th>完了率</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderWorkerTable() {
  const workerMap = {};
  allRecords.forEach(r => {
    const worker = getVal(r,'文字列__1行__10') || '未割当';
    if (!workerMap[worker]) workerMap[worker] = { done:0, absent:0, todo:0, nabon:0, henkyaku:0 };
    const s = getVal(r,'ドロップダウン');
    if (s === '完了') { workerMap[worker].done++; workerMap[worker].nabon += getNum(r,'数値'); workerMap[worker].henkyaku += getNum(r,'数値_0'); }

function renderPrevMonth() {
  const content = document.getElementById('prevmon-content');

  if (!prevMonthLabel || prevMonthRecords.length === 0) {
    content.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--muted);">
        <div style="font-size:40px;margin-bottom:12px">📭</div>
        <div style="font-size:14px;font-weight:700">前月号（${prevMonthLabel || '不明'}）のデータがありません</div>
      </div>`;
    return;
  }

  // Option B: 各月号の返却数は同じ月号のレコードに記録される
  // 5月号レコードの数値_0 = 5月号の返却数（6月号納本時に回収されたもの）
  const storeData = [];
  // 当月で稼働中の店舗のIDセット（消えた店舗を除外するため）
  const activeIds = new Set(allRecords.map(r => getVal(r,'文字列__1行__5')).filter(Boolean));

  prevMonthRecords.forEach(prev => {
    const sid = getVal(prev,'文字列__1行__5');
    if (!activeIds.has(sid)) return;  // 当月にない店舗はスキップ
    const prevNabon = getNum(prev,'数値');
    const prevRefill = getRefillTotal(prev);
    const henkyaku = getNum(prev,'数値_0');  // 前月号レコードに記録された前月号の返却数
    if (prevNabon <= 0) return;

    const supply = prevNabon + prevRefill;
    const shouka = supply - henkyaku;
    const rate = supply > 0 ? Math.round(shouka / supply * 100) : 0;
    storeData.push({
      sid,
      name: getVal(prev,'文字列__1行__1'),
      route: getVal(prev,'文字列__1行__4'),
      bldg: getVal(prev,'文字列__1行__2'),
      addr: getVal(prev,'文字列__1行__8'),
      genre: getVal(prev,'文字列__1行__6'),
      isOsoi: (prev['チェックボックス_0']?.value || []).length > 0,
      prevNabon,
      prevRefill,
      henkyaku,
      shouka,
      rate,
    });
  });

  if (storeData.length === 0) {
    content.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--muted);">
        <div style="font-size:40px;margin-bottom:12px">📭</div>

        <div style="font-size:12px;margin-top:8px;">当月レコードに返却数が入っているか確認してください</div>
      </div>`;
    return;
  }

  // 全体集計
  const totalPrevNabon = storeData.reduce((s,d) => s + d.prevNabon, 0);
  const totalPrevRefill = storeData.reduce((s,d) => s + d.prevRefill, 0);
  const totalHenkyaku = storeData.reduce((s,d) => s + d.henkyaku, 0);
  const totalSupply = totalPrevNabon + totalPrevRefill;
  const totalShouka = totalSupply - totalHenkyaku;
  const overallRate = totalSupply > 0 ? Math.round(totalShouka / totalSupply * 100) : 0;

  const rateColor = rate => rate >= 80 ? 'var(--green)' : rate >= 50 ? 'var(--amber)' : 'var(--red)';

  // ルート別集計
  const routeMap = {};
  storeData.forEach(d => {
    const key = d.isOsoi ? d.route + '遅' : d.route;
    if (!routeMap[key]) routeMap[key] = { nabon:0, refill:0, henkyaku:0, count:0 };
    routeMap[key].nabon += d.prevNabon;
    routeMap[key].refill += d.prevRefill;
    routeMap[key].henkyaku += d.henkyaku;
    routeMap[key].count++;
  });
  const routeRows = Object.entries(routeMap)
    .map(([route, d]) => {
      const supply = d.nabon + d.refill;
      return { route, ...d, shouka: supply - d.henkyaku, rate: supply > 0 ? Math.round((supply - d.henkyaku)/supply*100) : 0 };
    })
    .sort((a,b) => { const la = a.route.replace('遅',''), lb = b.route.replace('遅',''); return la !== lb ? la.localeCompare(lb) : (a.route.includes('遅') ? 1 : -1); });

  // 住所別集計
  const addrMap = {};

    let addr = '不明';
    if (d.addr && d.addr !== '-') {
      const parts = d.addr.split('-');

    addrMap[addr].nabon += d.prevNabon;
    addrMap[addr].refill += d.prevRefill;
    addrMap[addr].henkyaku += d.henkyaku;
    addrMap[addr].count++;
  });
  const addrRows = Object.entries(addrMap)
    .map(([addr, d]) => {

      return { addr, ...d, shouka: supply - d.henkyaku, rate: supply > 0 ? Math.round((supply - d.henkyaku)/supply*100) : 0 };
    })
    .sort((a,b) => b.rate - a.rate);

  // ジャンル別集計
  const genreMap = {};
  storeData.forEach(d => {
    const genre = d.genre || '不明';
    if (!genreMap[genre]) genreMap[genre] = { nabon:0, refill:0, henkyaku:0, count:0 };
    genreMap[genre].nabon += d.prevNabon;
    genreMap[genre].refill += d.prevRefill;
    genreMap[genre].henkyaku += d.henkyaku;
    genreMap[genre].count++;

  const genreRows = Object.entries(genreMap)
    .map(([genre, d]) => {
      const supply = d.nabon + d.refill;
      return { genre, ...d, shouka: supply - d.henkyaku, rate: supply > 0 ? Math.round((supply - d.henkyaku)/supply*100) : 0 };
    })
    .sort((a,b) => b.rate - a.rate);

    <div style="margin-top:16px;margin-bottom:12px;">

      </div>

    <!-- KPI -->
    <div class="kpi-grid">

        <div class="kpi-label">${prevMonthLabel} 納本数</div>
        <div class="kpi-val">${totalPrevNabon.toLocaleString()}</div>
        <div class="kpi-sub">${totalPrevRefill > 0 ? `+ <span style="color:var(--green);font-weight:700">${totalPrevRefill}補充</span>` : '冊'}</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-label">${prevMonthLabel} 返却数</div>
        <div class="kpi-val">${totalHenkyaku.toLocaleString()}</div>
        <div class="kpi-sub">冊</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">持去数</div>
        <div class="kpi-val">${totalShouka.toLocaleString()}</div>
        <div class="kpi-sub">冊</div>
      </div>
      <div class="kpi-card ${overallRate >= 70 ? 'green' : 'red'}">
        <div class="kpi-label">消化率</div>
        <div class="kpi-val">${overallRate}%</div>
        <div class="kpi-sub">${totalPrevRefill > 0 ? '(納本+補充)基準' : '実績ベース'}</div>
      </div>
    </div>

    <!-- サブタブ -->
    <div class="sub-tabs">
      <div class="sub-tab active" onclick="switchPrevTab('route',this)">🗺️ ルート</div>

        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>ルート</th><th>件数</th><th>納本</th><th>補充</th><th>返却</th><th>持去</th><th>消化率</th>
            </tr></thead>
            <tbody>${routeRows.map(d => `<tr${d.route.includes('遅') ? ' style="background:#fffbf0"' : ''}>
              <td><strong>${d.route}</strong></td>
              <td class="mono">${d.count}</td>
              <td class="mono">${d.nabon.toLocaleString()}</td>
              <td class="mono" style="color:var(--green)">${d.refill > 0 ? '+'+d.refill : '-'}</td>
              <td class="mono">${d.henkyaku.toLocaleString()}</td>

              <td class="mono" style="color:${rateColor(d.rate)};font-weight:700">${d.rate}%</td>

    <!-- 住所別 -->

        <div class="section-title">住所別 前月号消化率<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:8px">${addrRows.length}エリア</span></div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>住所</th><th>件数</th><th>納本</th><th>補充</th><th>返却</th><th>持去</th><th>消化率</th>

function switchPrevTab(id, el) {
  document.querySelectorAll('#prevmon-content .sub-tab').forEach(t => t.classList.remove('active'));

// ===== 配布物集計（請負報告用） =====
function renderHaifu() {
  const el = document.getElementById('haifu-content');
  if (!el) return;

  // 3枠それぞれについて、名称と状態を集計
  const slots = [1, 2, 3];
  const haifuData = [];

  slots.forEach(n => {
    const nameField = `haifu${n}_name`;
    const statusField = `haifu${n}_status`;
    // この枠に名称が入っているレコードを対象
    const withName = allRecords.filter(r => (getVal(r, nameField) || '').trim() !== '');
    if (withName.length === 0) return;

    // 配布物名（複数あり得るが通常1種類。最頻値を代表名に）
    const nameCounts = {};
    withName.forEach(r => {
      const nm = getVal(r, nameField).trim();
      nameCounts[nm] = (nameCounts[nm] || 0) + 1;
    });
    const repName = Object.entries(nameCounts).sort((a,b) => b[1]-a[1])[0][0];

    // 状態別集計
    let distributed = 0, notYet = 0, excluded = 0, blank = 0;
    const stores = { '配布済': [], '未配布': [], '対象外': [] };
    withName.forEach(r => {
      const st = getVal(r, statusField);
      const storeName = getVal(r, '文字列__1行__1') || '(店名不明)';
      const route = getVal(r, '文字列__1行__4') || '';
      const group = getVal(r, '文字列__1行__0') || '';
      const entry = { storeName, route, group };
      if (st === '配布済') { distributed++; stores['配布済'].push(entry); }
      else if (st === '未配布') { notYet++; stores['未配布'].push(entry); }
      else if (st === '対象外') { excluded++; stores['対象外'].push(entry); }
      else blank++;
    });

    haifuData.push({ slot: n, name: repName, total: withName.length, distributed, notYet, excluded, blank, stores });
  });

  if (haifuData.length === 0) {
    el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--muted);">
      <div style="font-size:32px;margin-bottom:10px;">📦</div>
      今月は配布物の記録がありません。<br>
      <span style="font-size:11px;">メンバー管理画面で配布物を設定し、作業者が記録すると集計されます。</span>
    </div>`;
    return;
  }

  el.innerHTML = haifuData.map(h => `
    <div style="background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="font-size:16px;font-weight:900;">📦 ${escH(h.name)}</div>
        <button class="export-btn" onclick="exportHaifuCSV(${h.slot})" style="font-size:11px;padding:6px 12px;">⬇️ CSV</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:70px;background:#e8f7ee;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:var(--green);">${h.distributed}</div>
          <div style="font-size:10px;color:var(--muted);">配布済</div>
        </div>
        <div style="flex:1;min-width:70px;background:#ffebeb;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:var(--red);">${h.notYet}</div>
          <div style="font-size:10px;color:var(--muted);">未配布</div>
        </div>
        <div style="flex:1;min-width:70px;background:#f0ede8;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:var(--muted);">${h.excluded}</div>
          <div style="font-size:10px;color:var(--muted);">対象外</div>
        </div>
        <div style="flex:1;min-width:70px;background:#faf8f4;border-radius:8px;padding:10px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:#bbb;">${h.blank}</div>
          <div style="font-size:10px;color:var(--muted);">未記録</div>
        </div>
      </div>

      <div class="sub-tabs" style="margin-bottom:10px;">
        <div class="sub-tab active" onclick="switchHaifuSub(${h.slot},'配布済',this)">配布済 (${h.distributed})</div>
        <div class="sub-tab" onclick="switchHaifuSub(${h.slot},'未配布',this)">未配布 (${h.notYet})</div>
        <div class="sub-tab" onclick="switchHaifuSub(${h.slot},'対象外',this)">対象外 (${h.excluded})</div>
      </div>

      <div id="haifu-stores-${h.slot}" style="max-height:400px;overflow:auto;">
        ${renderHaifuStoreList(h.stores['配布済'])}
      </div>
    </div>
  `).join('');

  // データを保持（サブタブ切替・CSV用）
  window._haifuData = haifuData;
}

function renderHaifuStoreList(stores) {
  if (!stores || stores.length === 0) {
    return '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">該当なし</div>';
  }
  return `<table class="data-table" style="width:100%;">
    <thead><tr><th>店名</th><th style="width:60px;">ルート</th><th style="width:60px;">グループ</th></tr></thead>
    <tbody>
      ${stores.map(s => `<tr><td>${escH(s.storeName)}</td><td>${escH(s.route)}</td><td>${escH(s.group)}</td></tr>`).join('')}
    </tbody>
  </table>`;
}

function switchHaifuSub(slot, status, el) {
  // サブタブのアクティブ切替
  el.parentElement.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const h = (window._haifuData || []).find(x => x.slot === slot);
  if (!h) return;
  document.getElementById(`haifu-stores-${slot}`).innerHTML = renderHaifuStoreList(h.stores[status]);
}

function exportHaifuCSV(slot) {
  const h = (window._haifuData || []).find(x => x.slot === slot);
  if (!h) return;
  let csv = '\uFEFF'; // BOM for Excel
  csv += `配布物名,${h.name}\n`;
  csv += `作業月,${currentMonth}\n\n`;
  csv += '店名,ルート,グループ,状態\n';
  ['配布済','未配布','対象外'].forEach(status => {
    h.stores[status].forEach(s => {
      csv += `"${(s.storeName||'').replace(/"/g,'""')}","${s.route}","${s.group}","${status}"\n`;
    });
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `配布物_${h.name}_${currentMonth}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function escH(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderShouka() {
  // 供給 = 通常納本数 + 補充、消化率 = (供給 - 返却) / 供給
  const records = allRecords.filter(r => getNum(r,'数値_2') > 0 || getNum(r,'数値_0') > 0);

  // 全体サマリー
  const totalNabon = allRecords.reduce((s,r) => s + getNum(r,'数値_2'), 0); // 通常納本数
  const totalRefill = allRecords.reduce((s,r) => s + getRefillTotal(r), 0); // 補充冊数
  const totalHenkyaku = allRecords.reduce((s,r) => s + getNum(r,'数値_0'), 0); // 返却数
  const totalSupply = totalNabon + totalRefill;
  const totalShouka = totalSupply - totalHenkyaku;
  const shoukaRate = totalSupply > 0 ? Math.round(totalShouka / totalSupply * 100) : 0;

  // マスタデータをkintone番号でインデックス化
  const masterIndex = {};
  masterRecords.forEach(m => {
    const kno = m['文字列__1行__0']?.value || '';
    if (kno) masterIndex[kno] = m;
  });

  // 住所別集計（納本データ管理の住所フィールドを優先、なければマスタ参照）
  const addrMap = {};
  allRecords.forEach(r => {
    let addr = '不明';
    const addrDirect = getVal(r,'文字列__1行__8'); // "条-丁目" 形式
    if (addrDirect && addrDirect !== '-') {
      const parts = addrDirect.split('-');
      const jo = parts[0] || '?';
      const chome = parts[1] || '?';
      addr = (jo === '100' && chome === '100') ? 'エリア外' : `${jo}条${chome}丁目`;
    } else {
      // マスタから参照
      const setchiId = getVal(r,'文字列__1行__5');
      const master = masterIndex[setchiId] || {};
      const jo = master['文字列__1行__7']?.value || '?';
      const chome = master['文字列__1行__8']?.value || '?';
      addr = (jo === '100' && chome === '100') ? 'エリア外' : `${jo}条${chome}丁目`;
    }
    if (!addrMap[addr]) addrMap[addr] = { nabon:0, refill:0, henkyaku:0, count:0 };
    addrMap[addr].nabon += getNum(r,'数値_2');
    addrMap[addr].refill += getRefillTotal(r);
    addrMap[addr].henkyaku += getNum(r,'数値_0');
    addrMap[addr].count++;
  });

  // ジャンル別集計（納本データ管理のジャンルフィールドを優先、なければマスタ参照）
  const genreMap = {};
  allRecords.forEach(r => {
    let genre = getVal(r,'文字列__1行__6'); // 直接フィールド
    if (!genre) {
      const setchiId = getVal(r,'文字列__1行__5');
      const master = masterIndex[setchiId] || {};
      genre = master['文字列__1行__1']?.value || '不明';
    }
    if (!genreMap[genre]) genreMap[genre] = { nabon:0, refill:0, henkyaku:0, count:0 };
    genreMap[genre].nabon += getNum(r,'数値_2');
    genreMap[genre].refill += getRefillTotal(r);
    genreMap[genre].henkyaku += getNum(r,'数値_0');
    genreMap[genre].count++;
  });

  // 店舗別（通常納本数の見直し候補）
  const shopRows = allRecords
    .filter(r => getNum(r,'数値_2') > 0)
    .map(r => {
      const nabon = getNum(r,'数値_2');
      const refill = getRefillTotal(r);
      const henkyaku = getNum(r,'数値_0');
      const supply = nabon + refill;
      const shouka = supply - henkyaku;
      const rate = supply > 0 ? Math.round(shouka / supply * 100) : 0;
      return { name: getVal(r,'文字列__1行__1'), nabon, refill, henkyaku, shouka, rate };
    })
    .sort((a,b) => a.rate - b.rate); // 消化率の低い順

  const addrRows = Object.entries(addrMap)
    .map(([addr, d]) => {
      const supply = d.nabon + d.refill;
      const shouka = supply - d.henkyaku;
      const rate = supply > 0 ? Math.round(shouka / supply * 100) : 0;
      return { addr, ...d, shouka, rate };
    })
    .sort((a,b) => b.rate - a.rate);

  const genreRows = Object.entries(genreMap)
    .map(([genre, d]) => {
      const supply = d.nabon + d.refill;
      const shouka = supply - d.henkyaku;
      const rate = supply > 0 ? Math.round(shouka / supply * 100) : 0;
      return { genre, ...d, shouka, rate };
    })
    .sort((a,b) => b.rate - a.rate);

  const rateColor = rate => rate >= 80 ? 'var(--green)' : rate >= 50 ? 'var(--amber)' : 'var(--red)';

  document.getElementById('shouka-content').innerHTML = `
    <!-- 全体サマリー -->
    <div class="kpi-grid" style="margin-top:16px">
      <div class="kpi-card blue">
        <div class="kpi-label">通常納本数合計</div>
        <div class="kpi-val">${totalNabon.toLocaleString()}</div>
        <div class="kpi-sub">${totalRefill > 0 ? `+ <span style="color:var(--green);font-weight:700">${totalRefill}補充</span>` : '冊'}</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-label">返却数合計</div>
        <div class="kpi-val">${totalHenkyaku.toLocaleString()}</div>
        <div class="kpi-sub">冊</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">持去数合計</div>
        <div class="kpi-val">${totalShouka.toLocaleString()}</div>
        <div class="kpi-sub">冊</div>
      </div>
      <div class="kpi-card ${shoukaRate >= 70 ? 'green' : 'red'}">
        <div class="kpi-label">消化率</div>
        <div class="kpi-val">${shoukaRate}%</div>
        <div class="kpi-sub">${totalRefill > 0 ? '(納本+補充)基準' : '持去率'}</div>
      </div>
    </div>

    <!-- サブタブ -->
    <div class="sub-tabs">
      <div class="sub-tab active" onclick="switchShoukaTab('addr',this)">📍 住所別</div>
      <div class="sub-tab" onclick="switchShoukaTab('genre',this)">🏷️ ジャンル別</div>
      <div class="sub-tab" onclick="switchShoukaTab('shop',this)">🏪 店舗別</div>
    </div>

    <!-- 住所別 -->
    <div class="sub-panel active" id="shouka-addr">
      <div class="section" style="margin-top:10px">
        <div class="section-title">住所別 消化率<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:8px">${addrRows.length}エリア</span></div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>住所</th><th>件数</th><th>納本</th><th>補充</th><th>返却</th><th>持去</th><th>消化率</th>
            </tr></thead>
            <tbody>${addrRows.map(d => `<tr>
              <td><strong>${d.addr}</strong></td>
              <td class="mono">${d.count}</td>
              <td class="mono">${d.nabon.toLocaleString()}</td>
              <td class="mono" style="color:var(--green)">${d.refill > 0 ? '+'+d.refill : '-'}</td>
              <td class="mono">${d.henkyaku.toLocaleString()}</td>
              <td class="mono">${d.shouka.toLocaleString()}</td>
              <td class="mono" style="color:${rateColor(d.rate)};font-weight:700">${d.rate}%</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ジャンル別 -->
    <div class="sub-panel" id="shouka-genre">
      <div class="section" style="margin-top:10px">
        <div class="section-title">ジャンル別 消化率<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:8px">${genreRows.length}ジャンル</span></div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>ジャンル</th><th>件数</th><th>納本</th><th>補充</th><th>返却</th><th>持去</th><th>消化率</th>
            </tr></thead>
            <tbody>${genreRows.map(d => `<tr>
              <td><strong>${d.genre}</strong></td>
              <td class="mono">${d.count}</td>
              <td class="mono">${d.nabon.toLocaleString()}</td>
              <td class="mono" style="color:var(--green)">${d.refill > 0 ? '+'+d.refill : '-'}</td>
              <td class="mono">${d.henkyaku.toLocaleString()}</td>
              <td class="mono">${d.shouka.toLocaleString()}</td>
              <td class="mono" style="color:${rateColor(d.rate)};font-weight:700">${d.rate}%</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 店舗別 -->
    <div class="sub-panel" id="shouka-shop">
      <div class="section" style="margin-top:10px">
        <div class="section-title">
          店舗別 消化率
          <span style="font-size:10px;font-weight:400;color:var(--muted)">消化率低い順（納本数見直し候補）</span>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>店名</th><th>通常納本</th><th>補充</th><th>返却</th><th>持去</th><th>消化率</th>
            </tr></thead>
            <tbody>${shopRows.map(d => `<tr>
              <td><strong>${d.name}</strong></td>
              <td class="mono">${d.nabon}</td>
              <td class="mono" style="color:var(--green)">${d.refill > 0 ? '+'+d.refill : '-'}</td>
              <td class="mono">${d.henkyaku}</td>
              <td class="mono">${d.shouka}</td>
              <td class="mono" style="color:${rateColor(d.rate)};font-weight:700">${d.rate}%</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderAbsent() {
  const absentRecords = allRecords
    .filter(r => getVal(r,'ドロップダウン') === '不在')
    .sort((a, b) => {
      const ra = getRouteKey(a), rb = getRouteKey(b);
      if (ra !== rb) return ra.localeCompare(rb);
      return getNum(a,'数値_1') - getNum(b,'数値_1');
    });

  if (!absentRecords.length) {
    document.getElementById('absent-content').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--muted);">
        <div style="font-size:40px;margin-bottom:12px">✅</div>
        <div style="font-size:14px;font-weight:700">不在店舗はありません</div>
      </div>`;
    return;
  }

  // ルート別にグループ化
  const routeGroups = {};
  absentRecords.forEach(r => {
    const route = getRouteKey(r);
    if (!routeGroups[route]) routeGroups[route] = [];
    routeGroups[route].push(r);
  });

  const sortedRoutes = Object.keys(routeGroups).sort((a, b) => {
    const la = a.replace('遅',''), lb = b.replace('遅','');
    if (la !== lb) return la.localeCompare(lb);
    return a.includes('遅') ? 1 : -1;
  });

  const html = `
    <div style="margin-top:16px">
      <div style="background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
        <div style="font-size:28px;font-family:'DM Mono',monospace;font-weight:500;color:var(--amber)">${absentRecords.length}</div>
        <div>
          <div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em">不在件数</div>
          <div style="font-size:12px;color:var(--muted)">2周目の訪問が必要です</div>
        </div>
      </div>
      ${sortedRoutes.map(route => {
        const recs = routeGroups[route];
        const isOsoi = route.includes('遅');
        return `
          <div class="section" style="margin-bottom:12px;">
            <div class="section-title">
              ルート${route}
              ${isOsoi ? '<span style="font-size:10px;color:var(--amber);font-weight:700;margin-left:4px">遅</span>' : ''}
              <span style="font-size:11px;color:var(--amber);font-weight:700">${recs.length}件</span>
            </div>
            ${recs.map(r => {
              const t1 = getVal(r,'文字列__1行__11');
              const t2 = getVal(r,'文字列__1行__12');
              const t3 = getVal(r,'文字列__1行__13');
              const times = [t1,t2,t3].filter(Boolean).map((t,i) => `${i+1}回目 ${t}`).join('　');
              const location = getVal(r,'文字列__1行__7');
              const comment = getVal(r,'文字列__1行__9');
              return `
                <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                    <div style="flex:1;">
                      <div style="font-size:13px;font-weight:700;">${getVal(r,'文字列__1行__1')}</div>
                      <div style="font-size:11px;color:var(--muted);margin-top:2px;">${getVal(r,'文字列__1行__2')}${getVal(r,'文字列__1行__3') ? ' '+getVal(r,'文字列__1行__3')+'階' : ''}</div>
                      ${location ? `<div style="font-size:11px;color:#555;margin-top:2px;">📍${location}</div>` : ''}
                      ${comment ? `<div style="font-size:11px;color:#7a5a00;background:#fff8e8;padding:2px 6px;border-radius:4px;margin-top:3px;border-left:2px solid var(--amber);">💬${comment}</div>` : ''}
                    </div>
                    <div style="flex-shrink:0;text-align:right;">
                      <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--amber);">${times || '時刻未記録'}</div>
                      <div style="font-size:10px;color:var(--muted);margin-top:2px;">担当: ${getVal(r,'文字列__1行__10') || '未割当'}</div>
                    </div>
                  </div>
                </div>`;
            }).join('')}
          </div>`;
      }).join('')}
    </div>`;

  document.getElementById('absent-content').innerHTML = html;
}

function switchShoukaTab(id, el) {
  document.querySelectorAll('#shouka-content .sub-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#shouka-content .sub-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('shouka-' + id).classList.add('active');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('screen-' + tab).classList.add('active');
}

function exportCSV() {
  const headers = ['ルート','ルート順','店名','ビル名','階数','担当者名','納本数','返却数','ステータス','不在時間1','不在時間2','不在時間3','メモ'];
  const escape = v => {
    const s = String(v ?? '');
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
  };
  let csv = '\uFEFF' + headers.map(escape).join(',') + '\n';
  allRecords.forEach(r => {
    csv += [
      getVal(r,'文字列__1行__4'),
      getVal(r,'数値_1'),
      getVal(r,'文字列__1行__1'),
      getVal(r,'文字列__1行__2'),
      getVal(r,'文字列__1行__3'),
      getVal(r,'文字列__1行__10'),
      getVal(r,'数値'),
      getVal(r,'数値_0'),
      getVal(r,'ドロップダウン'),
      getVal(r,'文字列__1行__11'),
      getVal(r,'文字列__1行__12'),
      getVal(r,'文字列__1行__13'),
      getVal(r,'文字列__複数行_'),
    ].map(escape).join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `集計_${currentMonth}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
